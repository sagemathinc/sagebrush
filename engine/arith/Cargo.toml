[package]
name = "sagebrush-arith"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Exact arithmetic for the Sagebrush engines: word-size moduli, number-theoretic transforms, polynomials over Z/n, Z and Q, and dense matrices over Z/p, Z and Q (multimodular, certified)"

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-par = { path = "../par" }
sagebrush-wire = { path = "../wire" }
num-integer = "0.1"
num-traits = "0.2"
dashu-int = { git = "https://github.com/sagemathinc/dashu", rev = "36ff7ad5b9225198bf6a322a70f0947e9376cece" }

[dev-dependencies]
# (tests only: the checked extended gcd's fallback forced, tests/xgcd_charge.rs)
sagebrush-bigint = { path = "../bigint", features = ["test-hooks"] }
sagebrush-interrupt = { path = "../interrupt", features = ["test-hooks"] }

[lints]
workspace = true
