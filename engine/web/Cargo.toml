[package]
name = "sagebrush-web"
version = "0.1.0"
edition = "2021"
description = "Sagebrush engines for browsers and chat artifacts: plain wasm32, JSON in/out, no wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sagebrush-modsym = { path = "../modsym", default-features = false }
sagebrush-ap = { path = "../ap", default-features = false }
sagebrush-poly = { path = "../poly" }
serde_json = "1"
num-bigint = "0.4"
