name: prb-windows

# Ctrl-C PR B's Windows runtime evidence (daybreak2's PR B r1 #3): the native
# request loop on a real Windows runner, release and test-hooks wheels;
# exactly one admission and one reply per request, the fallback and encode
# injections, the lifecycle tests; the stale-target rows are expected to fail
# there (CORR-CTRLC-3-Windows, recorded as XFAIL).  Only on the throwaway
# branch prb-windows-evidence (never on master); nothing is published.

on:
  push:
    branches: ["prb-windows-evidence"]

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [release, hooks]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: engine/py
          args: --release --out dist ${{ matrix.kind == 'hooks' && '--features pyo3/abi3-py39,test-hooks' || '' }}
      - name: install the wheel
        shell: bash
        run: python -m pip install engine/py/dist/*.whl
      - name: the tests
        shell: bash
        timeout-minutes: 40
        run: |
          mkdir -p logs
          status=0
          for t in test_ctrlc_native test_ctrlc_cleanup test_session_ctrl test_runs; do
            c=0; (cd engine/py && python $t.py) > logs/$t.log 2>&1 || c=$?
            echo "$t exit $c: $(grep -c '^ok' logs/$t.log) ok, $(grep -c '^FAIL' logs/$t.log) FAIL, $(grep -c '^XFAIL' logs/$t.log) XFAIL"
            grep -E '^(FAIL|XFAIL|XPASS)' logs/$t.log | head -20 || true
            if [ $c -ne 0 ]; then status=1; fi
          done
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: prb-windows-${{ matrix.kind }}
          path: logs/
          retention-days: 7
