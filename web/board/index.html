<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: the page itself doesn't zoom, as a pinch or a double tap zooms the board (which a page zoom would leave half off screen).  Only on this page: never on a page with ordinary text, whose readers may need to zoom it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Board — Sagebrush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="canonical" href="https://sagebrush.space/board/">
<style>
  /* the page; the board's own rules come with its script (board.css, put in by mount.ts) */
  html, body { margin: 0; height: 100%; background: #fafaf7; color: #1d241a; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* (bottom: clear of the site's early-alpha notice while it shows, web/alpha-banner.js; 0 everywhere else) */
  #board { position: fixed; inset: 0; bottom: var(--sb-alpha-banner, 0px); }
  /* (presenting, the board fills the window and the notice steps aside; no notice elsewhere, so no effect) */
  #board.sbb-present { bottom: 0; }
  /* (the terminal's dock open, web/shell/panel.ts: the board ends above it; --sb-term-h is the dock's height and its lift) */
  body.sb-term-open #board:not(.sbb-present) { bottom: var(--sb-term-h, 280px); }
  html:has(.sbb-present) #sb-alpha-banner { display: none !important; }
</style>
</head>
<body>
<div id="board"></div>
<script type="module" src="/board/board.js"></script>
</body>
</html>
