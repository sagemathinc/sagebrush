name: pypi

# Wheels (abi3: one per platform for every Python >= 3.10) and the sdist of
# the `sagebrush` Python package (engine/py).  A manual run only builds and
# tests; a `py-v*` tag also publishes to PyPI by trusted publishing (OIDC: no
# token is stored), which needs a PyPI trusted publisher for this repository,
# workflow `pypi.yml` and environment `pypi`.

on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  wheels:
    if: github.repository == 'sagemathinc/sagebrush'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: engine/py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: install the wheel
        shell: bash
        run: python -m pip install engine/py/dist/*.whl
      # (first, before the wheel tests, so an unrelated failure there can't keep it from running)
      - name: the memory this machine shows (lib/_capacity.py), named by its source
        shell: bash
        run: |
          # (the collector's own sources, for the log: a normal runner must give a number, never None)
          python -c "import json, sagebrush; C = sagebrush._capacity_module(); r = C.capacity(); print(json.dumps({'bytes': r['bytes'], 'sources': [b['source'] for b in r['basis']], 'unknown': r['unknown_parts'], 'diagnosis': C.diagnosis(), 'total': C._machine_total()})); assert r['bytes'] and r['bytes'] > 0, 'capacity() has no figure here: %r' % (C.diagnosis(),)"
          python -I test/capacity_ctypes_cases.py
          # (on Windows, each kernel32/psapi call typed and untyped: board's probe, which changes nothing)
          if [ "$RUNNER_OS" = Windows ]; then python test/win_capacity_probe.py engine/py/python/sagebrush/_sagelib || true; fi
          # (what interrupts a blocked computation in a session worker: CREATE_NEW_PROCESS_GROUP, Ctrl-Break; a probe, which changes nothing)
          if [ "$RUNNER_OS" = Windows ]; then python test/win_interrupt_probe.py || true; fi
      - name: test the wheel
        shell: bash
        run: |
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('engine/py/dist/*.whl')[0]).namelist(); need = ['LICENSE-MIT', 'LICENSE-APACHE', 'LICENSE-Artistic-2.0.txt', 'THIRD-PARTY-NOTICES.txt']; missing = [n for n in need if not any(x.endswith('/' + n) for x in names)]; assert not missing, missing; print('license files in the wheel: ok')"
          python sage-tests/run_cpython.py -v
          python sage-tests/run_cpython.py --own -v
          python sage-tests/run_calculus.py
          python engine/py/test_interrupt.py
          python engine/py/test_audit.py
          python engine/py/test_mcp.py
          python engine/py/test_session_ctrl.py
          python engine/py/test_python_floor.py --wheel
          cd engine/py && python -m doctest README.md && echo doctests ok
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: engine/py/dist/*.whl

  # The floor, as a tested claim: the Linux x86_64 abi3 wheel built above, installed on
  # Python 3.10 (the oldest supported) and 3.11, with the Sage suites, and the worker's owning print()
  # (gh-130163: 3.10 and 3.11 keep CPython's borrowing print, so the owning one is in use there)
  floor:
    if: github.repository == 'sagemathinc/sagebrush'
    needs: [wheels]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      - name: the wheel on Python ${{ matrix.python }}, with the suites
        shell: bash
        run: |
          python --version
          python -m pip install dist/*.whl
          python engine/py/test_python_floor.py --wheel
          (cd engine/py && python -c "import sagebrush.session as S, test_runs as t; assert S._print_borrows_stdout(), 'the owning print() must be in use here'; t.test_print_gate(); t.test_strong_print(); t.test_print_across_runs()")
          python sage-tests/run_cpython.py -v
          python sage-tests/run_cpython.py --own -v
          python sage-tests/run_calculus.py

  sdist:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: engine/py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sdist
          path: engine/py/dist/*.tar.gz

  publish:
    if: github.repository == 'sagemathinc/sagebrush' && startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, sdist, floor]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
