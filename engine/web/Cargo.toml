[package]
name = "sagebrush-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sagebrush engines for browsers and chat artifacts: plain wasm32, JSON in/out, no wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-interrupt = { path = "../interrupt", features = ["wasm-host"] }
sagebrush-modsym = { path = "../modsym", default-features = false }
sagebrush-ap = { path = "../ap", default-features = false }
sagebrush-poly = { path = "../poly" }
sagebrush-classgroup = { path = "../classgroup" }
serde_json = "1"
