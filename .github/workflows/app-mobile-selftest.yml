# The app's self-test on an Android emulator: the debug APK (x86_64, for the
# emulator) runs app/selftest's notebook inside Android's WebView (Sage and the
# engines, a file in the notebook's folder, 3D, Python writing a file, Stop,
# saving), through the debug-only hooks in app/src-tauri/src/lib.rs and
# app/selftest/android-selftest.sh.  It answers whether the page is
# cross-origin isolated in Android's WebView (SharedArrayBuffer, so Stop keeps
# the variables): that and Stop are reported in the job summary, not required.
#
# Its own workflow, so a slow or failing emulator never blocks a merge: never
# a required check, never a need of ci.yml's aggregate.  It runs on master
# pushes that touch the app or the page, on PRs only when they touch the
# Android project, the app's Rust code, Cargo or tauri.conf.json, or the
# self-test, nightly, and by hand.  Expected 20-30 min; bounded by the job's
# 40 min, the emulator's 600 s boot timeout and the script's 300 s wait for
# the report.  The emulator job has two legs on API 34: "image" (the image's
# own WebView, every run) and "current" (a pinned current WebView build
# sideloaded and selected; the nightly cron, by hand and pull requests, never
# master pushes).  A second job, release-starts, checks that the RELEASE build
# starts (see it below); its own 40 min, in parallel.
#
# Pinned: the runner image's Android SDK, NDK 27.3.13750724 and JDK 17 (no
# downloads); the current leg's one download, Chromium's snapshot
# AndroidDesktop_x64/1727419, by the sha256 of its zip and of its APK; Rust 1.99.0; tauri-cli 2.12.4 --locked; Gradle and its
# dependencies through the committed checksums (app/src-tauri/gen/android);
# reactivecircus/android-emulator-runner v2.38.0 by commit; the system image
# system-images;android-34;google_apis;x86_64 and the stable emulator, which
# sdkmanager checks against Google's repository.
name: app-mobile-selftest

on:
  push:
    branches: [master]
    paths: ["app/**", "web/index.html", ".github/workflows/app-mobile-selftest.yml"]
  pull_request:
    paths: ["app/src-tauri/gen/android/**", "app/src-tauri/src/**", "app/src-tauri/Cargo.toml", "app/src-tauri/Cargo.lock", "app/src-tauri/tauri.conf.json", "app/selftest/**", ".github/workflows/app-mobile-selftest.yml"]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-mobile-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # (the same page as app.yml's page job)
  page:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/build-cli.mjs
      - run: bun web/build.ts
      - run: node app/build-frontend.mjs
      # (the COI diagnosis is its own module, loaded only by the app's self-test:
      # the page everyone loads carries only the call; and the controls FAIL)
      - name: the self-test's diagnosis is not in the page
        run: node app/selftest/check-diagnose-lazy.mjs app/dist && node app/selftest/check-diagnose-lazy.mjs app/dist --control
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-page
          path: app/dist

  # (two legs on API 34: "image", the image's own WebView, every run; and
  # "current", a pinned current WebView build sideloaded and selected
  # (COI Stage B), on the nightly cron, by hand and on pull requests, never on
  # master pushes: it downloads about 500 MB. The build: Chromium's official
  # snapshot AndroidDesktop_x64/1727419 (the newest at or below the M158 branch
  # point; a trunk snapshot, not a stable-channel build), its zip and APK each
  # pinned by sha256 and checked by app/selftest/verify-then.sh before use)
  emulator:
    if: github.repository == 'sagemathinc/sagebrush'
    needs: page
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        webview: ${{ fromJSON(github.event_name == 'push' && '["image"]' || '["image", "current"]') }}
    env:
      NDK_VERSION: 27.3.13750724
      TAURI_CLI_VERSION: 2.12.4
      BUILD_TOOLS_VERSION: 35.0.0
      WEBVIEW_URL: https://storage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64/1727419/chrome-android-desktop.zip
      WEBVIEW_ZIP_SHA256: bfc4c333340726ef39c3e410c5abd40455575ae1477c578d8ad0338564cdc29c
      WEBVIEW_APK_SHA256: 2ac87d41b05a24fe22dbc00c574b113a6848b3c114446166dab7ad84c326fa27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # (the judges on fixed inputs, before anything slow: the self-test report,
      # the WebView provider checker, and the hash gate with a wrong hash on a
      # small fixture, which must fail without reaching its command)
      - name: the self-test report judge, the COI diagnosis readers and the Terminal probe's log reader
        run: bash app/selftest/test-android-report.sh && bash app/selftest/test-coi-reading.sh && node app/selftest/test-report-lines.mjs && node app/selftest/test-diagnose.mjs && bash app/selftest/test-probe-log.sh && bash app/selftest/test-wait-log-sentinel.sh && node app/selftest/test-run-judge.mjs
      - name: the WebView provider checker and the hash gate
        run: bash app/selftest/test-webview-provider.sh && bash app/selftest/test-verify-then.sh && bash app/selftest/test-webview-badging.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-page
          path: app/dist
      - name: the runner's Android SDK, NDK and JDK 17 (no downloads)
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$ndk/source.properties" ]; then echo "NDK $NDK_VERSION is not on this runner image:"; ls "$ANDROID_HOME/ndk"; exit 1; fi
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "$JAVA_HOME_17_X64/bin/java" ]; then echo "no JDK 17 on this runner image"; exit 1; fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
          grep Pkg.Revision "$ndk/source.properties"
          "$JAVA_HOME_17_X64/bin/java" -version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch master
        with:
          toolchain: 1.99.0
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: android-x86_64
      - name: the Tauri CLI (crate tauri-cli ${{ env.TAURI_CLI_VERSION }}, --locked)
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo tauri --version
      - name: the committed Android project and its wrapper jar
        working-directory: app/src-tauri/gen/android
        run: |
          set -euo pipefail
          printf '%s\n' '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -qx 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties
          test -f gradle/verification-metadata.xml
      # (a debug build: its self-test hooks exist only there, and run-as needs a debuggable APK)
      - name: build (debug APK, x86_64, for the emulator)
        working-directory: app/src-tauri
        run: cargo tauri android build --debug --apk --target x86_64
      - name: the APK
        id: apk
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/src-tauri/gen/android -name '*.apk' -path '*outputs*')
          [ "${#apks[@]}" = 1 ] || { echo "expected exactly one APK, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          ls -l "${apks[0]}"; sha256sum "${apks[0]}"
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
      - name: the committed project is unchanged by the build
        run: test -z "$(git status --porcelain -- app/src-tauri/gen/android)"
      # (the current-WebView leg: download, then the zip's sha256 BEFORE
      # unzipping, then the APK's sha256 BEFORE anything reads it; the expected
      # version is the verified APK's own versionName, from aapt2)
      - name: the pinned WebView build, downloaded and verified
        if: matrix.webview == 'current'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/webview"; mkdir -p "$d"
          curl -sS --fail --retry 3 --max-time 900 -o "$d/chrome-android-desktop.zip" "$WEBVIEW_URL"
          bash app/selftest/verify-then.sh "$WEBVIEW_ZIP_SHA256" "$d/chrome-android-desktop.zip" -- unzip -q -o "$d/chrome-android-desktop.zip" chrome-android-desktop/apks/SystemWebView.apk -d "$d"
          apk="$d/chrome-android-desktop/apks/SystemWebView.apk"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/aapt2" ] || { echo "build-tools $BUILD_TOOLS_VERSION has no aapt2 on this runner image:"; ls "$ANDROID_HOME/build-tools"; exit 1; }
          bash app/selftest/verify-then.sh "$WEBVIEW_APK_SHA256" "$apk" -- "$bt/aapt2" dump badging "$apk" > "$d/badging.txt"
          python3 -I app/selftest/webview-badging.py "$d/badging.txt" 34 | tee "$d/badging-check.txt"
          ver=$(sed -n 's/^VERSION=//p' "$d/badging-check.txt")
          [ -n "$ver" ] || { echo "FAIL: no VERSION from webview-badging.py"; exit 1; }
          {
            echo "pinned WebView build: $WEBVIEW_URL"
            echo "zip sha256 $WEBVIEW_ZIP_SHA256, APK sha256 $WEBVIEW_APK_SHA256 (both verified)"
            grep '^ok: com.android.webview' "$d/badging-check.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "WEBVIEW_APK=$apk" >> "$GITHUB_ENV"
          echo "WEBVIEW_VERSION=$ver" >> "$GITHUB_ENV"
      # (KVM for the emulator: the action's documented udev rule)
      - name: KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # (the disk for the AVD: its userdata needs 7372.80 MB under
      # $HOME/.android/avd, which runner image 20261018.96.1 didn't have, twice:
      # #384 run 41124748735, #380 run 41154237915; df printed, unused
      # preinstalled toolchains removed, then a clear failure below 8192 MB)
      - name: the disk for the AVD
        run: bash app/selftest/test-disk-before-avd.sh && bash app/selftest/disk-before-avd.sh 8192
      - name: the self-test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          channel: stable
          emulator-boot-timeout: 600
          disable-animations: true
          # (one line: the action runs each line of `script` as its own shell.
          # app/selftest/android-selftest-leg.sh: on "current", the sideload and
          # its provider check first, and the provider check again after; on
          # both legs android-image-info.sh (the booted image must be API 34; the
          # summary records "WebView <ver>: current|old against threshold 145")
          # and the self-test)
          script: bash app/selftest/android-selftest-leg.sh "${{ matrix.webview }}" "${{ steps.apk.outputs.path }}" "$GITHUB_STEP_SUMMARY"

  # The RELEASE APK (x86_64, for the emulator) starts: R8 or LTO removing
  # something reached only through JNI or reflection crashes it, which the
  # debug self-test above can't see.  A copy signed with a throwaway key
  # (app/selftest/sign-testkey.sh, as app-mobile.yml's release job) is installed
  # on a clean emulator, started, and must keep running with a WebView renderer
  # and no crash (app/selftest/android-release-start.sh).  Nothing is uploaded.
  # In parallel with `emulator`, with its own 40 min.
  release-starts:
    if: github.repository == 'sagemathinc/sagebrush'
    needs: page
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NDK_VERSION: 27.3.13750724
      BUILD_TOOLS_VERSION: 35.0.0
      TAURI_CLI_VERSION: 2.12.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # (the logcat judge on fixed dumps, before anything slow)
      - name: the logcat judge
        run: bash app/selftest/test-logcat-crash.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-page
          path: app/dist
      - name: the runner's Android SDK, NDK, build-tools and JDK 17 (no downloads)
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -f "$ndk/source.properties" ]; then echo "NDK $NDK_VERSION is not on this runner image:"; ls "$ANDROID_HOME/ndk"; exit 1; fi
          for t in apksigner zipalign aapt2; do [ -x "$bt/$t" ] || { echo "build-tools $BUILD_TOOLS_VERSION has no $t on this runner image:"; ls "$ANDROID_HOME/build-tools"; exit 1; }; done
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "$JAVA_HOME_17_X64/bin/java" ]; then echo "no JDK 17 on this runner image"; exit 1; fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "BT=$bt" >> "$GITHUB_ENV"
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
          grep Pkg.Revision "$ndk/source.properties"
          "$JAVA_HOME_17_X64/bin/java" -version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch master
        with:
          toolchain: 1.99.0
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: android-release-x86_64
      - name: the Tauri CLI (crate tauri-cli ${{ env.TAURI_CLI_VERSION }}, --locked)
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo tauri --version
      - name: the committed Android project and its wrapper jar
        working-directory: app/src-tauri/gen/android
        run: |
          set -euo pipefail
          printf '%s\n' '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -qx 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties
          test -f gradle/verification-metadata.xml
      - name: build (release APK, x86_64, for the emulator)
        working-directory: app/src-tauri
        run: |
          set -euo pipefail
          s=$(date +%s)
          cargo tauri android build --apk --target x86_64
          echo "release build (x86_64): $(( $(date +%s) - s )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: exactly one APK, unsigned
        id: apk
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          [ "${#apks[@]}" = 1 ] || { echo "expected exactly one APK, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          case "${apks[0]}" in */app-universal-release-unsigned.apk) ;; *) echo "expected app-universal-release-unsigned.apk, found ${apks[0]}"; exit 1;; esac
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
      - name: the committed project is unchanged by the build
        run: test -z "$(git status --porcelain -- app/src-tauri/gen/android)"
      - name: a copy signed with a throwaway key (TESTKEY, not for distribution)
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: bash app/selftest/sign-testkey.sh "$APK" build/release-testkey/sagebrush-release-x86_64-TESTKEY.apk
      # (KVM for the emulator: the action's documented udev rule)
      - name: KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # (the disk for the AVD: its userdata needs 7372.80 MB under
      # $HOME/.android/avd, which runner image 20261018.96.1 didn't have, twice:
      # #384 run 41124748735, #380 run 41154237915; df printed, unused
      # preinstalled toolchains removed, then a clear failure below 8192 MB)
      - name: the disk for the AVD
        run: bash app/selftest/test-disk-before-avd.sh && bash app/selftest/disk-before-avd.sh 8192
      - name: the release APK starts on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          channel: stable
          emulator-boot-timeout: 600
          disable-animations: true
          # (one line: the action runs each line of `script` as its own shell)
          script: bash app/selftest/android-release-start.sh build/release-testkey/sagebrush-release-x86_64-TESTKEY.apk "$GITHUB_STEP_SUMMARY"
