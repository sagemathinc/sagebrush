<!doctype html>
<meta charset="utf-8">
<title>Sagebrush runner</title>
<!--
The runner (design/runner.md): Python's interpreter in a frame with an opaque
origin and no network.  A page loads this in <iframe sandbox="allow-scripts">
(no allow-same-origin), so here there is no cookie, no IndexedDB, no
localStorage and no page; by this page's Content-Security-Policy
(web/csp.ts: connect-src 'none'), no network either.  Its worker, started
from a blob: URL, inherits all of that.

The page sends one message with a MessagePort and the interpreter's script.
From then on messages go page <-> this frame <-> the worker.  A file the
worker needs (the engine, a shared collection's file) is fetched by the page
and copied to the worker through a SharedArrayBuffer while it waits (its
reads are synchronous).  The interrupt flag stays here: the page asks for
Stop by message, and input()'s answers too (design/runner.md, How 7), and
live data's (src/live-data.ts): the operation goes to the page unchanged, its
buffer staying here, and the page's answer is written to it.
-->
<script>
(() => {
  const CHUNK = 4 << 20;
  let started = false;
  addEventListener("message", (e) => {
    if (started || e.source !== parent || !e.data || e.data.sagebrushRunner !== 1 || e.ports.length !== 1 || typeof e.data.script !== "string" || typeof e.data.base !== "string") return;
    started = true;
    const port = e.ports[0];
    try {
      // (the worker resolves its other files against base, as its own URL is a blob:)
      const prefix = "self.__SB_BASE__ = " + JSON.stringify(e.data.base) + "; self.__SB_BROKERED__ = true;\n";
      const url = URL.createObjectURL(new Blob([prefix, e.data.script], { type: "text/javascript" }));
      // (a classic worker: Chrome refuses a module worker from a blob: in an
      // opaque origin, and the bundle has no imports or exports)
      const w = new Worker(url, { name: String(e.data.name ?? "") });
      const ctrl = new Int32Array(new SharedArrayBuffer(16));
      const data = new Uint8Array(new SharedArrayBuffer(CHUNK));
      w.postMessage({ broker: { ctrl: ctrl.buffer, data: data.buffer } });
      // files the page fetched, by URL; requests waiting for the page
      const files = new Map(), waiting = new Map();
      let next = 0;
      // (a file is kept here only while the worker reads it, a chunk at a time)
      const answer = (url, bytes, offset) => {
        if (!bytes) {
          Atomics.store(ctrl, 1, 2);
        } else {
          const n = Math.max(0, Math.min(CHUNK, bytes.length - offset));
          data.set(bytes.subarray(offset, offset + n));
          Atomics.store(ctrl, 1, 1);
          Atomics.store(ctrl, 2, n);
          Atomics.store(ctrl, 3, bytes.length);
          if (offset + n >= bytes.length) files.delete(url);
          else files.set(url, bytes);
        }
        Atomics.store(ctrl, 0, 1);
        Atomics.notify(ctrl, 0);
      };
      let flag = null, writable = null;
      // input() (design/runner.md, How 7): open requests by key, {id: the run,
      // buffer}; an answer writes only to the one its key and run name.  A
      // request is over at its answer, its run's next question or end, a Stop.
      const inputs = new Map();
      const retire = (id) => {
        for (const [key, e] of inputs) if (id === undefined || e.id === id) inputs.delete(key);
      };
      const giveInput = (buffer, text) => {
        const ctl = new Int32Array(buffer, 0, 2);
        if (Atomics.load(ctl, 0) !== 0) return;
        if (typeof text !== "string") {
          Atomics.store(ctl, 0, 2);
        } else {
          const max = buffer.byteLength - 8, enc = new TextEncoder();
          let s = text, bytes = enc.encode(s);
          while (bytes.length > max) bytes = enc.encode((s = Array.from(s).slice(0, -Math.max(1, Math.ceil((bytes.length - max) / 4))).join("")));
          new Uint8Array(buffer, 8, bytes.length).set(bytes);
          Atomics.store(ctl, 1, bytes.length);
          Atomics.store(ctl, 0, 1);
        }
        Atomics.notify(ctl, 0);
      };
      // live data (src/live-data.ts): open requests by key, {id: the run, buffer};
      // the page's answer is written once, to the one its key and run name,
      // and a request is over at its answer, its run's end or a Stop
      const LIVE_BYTES = 8 + (8 << 20);
      const lives = new Map();
      const retireLive = (id) => {
        for (const [key, e] of lives) if (id === undefined || e.id === id) lives.delete(key);
      };
      const giveLive = (buffer, answer) => {
        const ctl = new Int32Array(buffer, 0, 2);
        if (Atomics.load(ctl, 0) !== 0) return;
        let bytes;
        try {
          bytes = new TextEncoder().encode(JSON.stringify(answer));
        } catch {
          bytes = null;
        }
        // (the worker checks the answer again: anything it doesn't take is unavailable)
        if (!bytes || bytes.length > buffer.byteLength - 8) bytes = new TextEncoder().encode('{"error":"unavailable"}');
        new Uint8Array(buffer, 8, bytes.length).set(bytes);
        Atomics.store(ctl, 1, bytes.length);
        Atomics.store(ctl, 0, 1);
        Atomics.notify(ctl, 0);
      };
      w.onmessage = (m) => {
        let d = m.data;
        if (d && d.liveData && d.buffer instanceof SharedArrayBuffer && d.buffer.byteLength === LIVE_BYTES) {
          // (a key already open keeps its destination: the duplicate changes nothing here and goes no further,
          // so an answer is written only where its own request waits; astra's LIVE691-REPLAY-1)
          if (typeof d.liveData.key !== "string" || lives.has(d.liveData.key)) return;
          retireLive(d.id);
          lives.set(d.liveData.key, { id: d.id, buffer: d.buffer });
          d = { ...d, buffer: null };
        }
        if (d && d.input && d.buffer instanceof SharedArrayBuffer && d.buffer.byteLength >= 8) {
          retire(d.id);
          if (typeof d.input.key === "string") inputs.set(d.input.key, { id: d.id, buffer: d.buffer });
          d = { ...d, buffer: null };
        }
        if (d && (d.done || d.skipped)) { retire(d.id); retireLive(d.id); }
        if (d && typeof d.brokerFetch === "string") {
          const off = Number(d.offset) || 0;
          const have = files.get(d.brokerFetch);
          if (have) return answer(d.brokerFetch, have, off);
          const id = ++next;
          waiting.set(id, off);
          port.postMessage({ runnerFetch: id, url: d.brokerFetch });
          return;
        }
        if (d && d.ready && d.interrupt) {
          flag = new Int32Array(d.interrupt);
          d = { ...d, interrupt: null, interruptible: true };
        }
        // (what it may change: the page's {fsWrite}; this frame holds the worker's epoch word)
        if (d && d.ready && d.epoch) { writable = new Int32Array(d.epoch); d = { ...d, epoch: null, epochShared: true }; }
        // (the shared progress slots stay here too: a SharedArrayBuffer can't
        // cross to the page, and this frame doesn't relay them)
        if (d && d.ready && d.progress) d = { ...d, progress: null };
        port.postMessage(d);
      };
      w.onerror = (ev) => port.postMessage({ runnerError: String(ev.message || "an error in the interpreter") });
      port.onmessage = (m) => {
        const d = m.data;
        if (d && typeof d.runnerInterrupt === "number") {
          retire(); // (every open input() request is over)
          retireLive();
          if (flag) {
            Atomics.store(flag, 1, d.runnerInterrupt);
            // (bit 0, and the word notified: a time.sleep waits on it, src/runtime/interrupt.ts requestCtrlC)
            Atomics.or(flag, 0, 1);
            Atomics.notify(flag, 0);
          }
          return;
        }
        // (the new epoch stored BEFORE the policy goes on to the worker: a run in flight refuses at its next change)
        if (d && d.fsWrite && Number.isInteger(d.fsWrite.epoch) && writable) Atomics.store(writable, 0, d.fsWrite.epoch);
        if (d && typeof d.runnerInput === "number") {
          const e = typeof d.key === "string" ? inputs.get(d.key) : undefined;
          if (e && e.id === d.runnerInput) {
            inputs.delete(d.key);
            giveInput(e.buffer, d.text);
          }
          return;
        }
        if (d && typeof d.runnerLive === "number") {
          const e = typeof d.key === "string" ? lives.get(d.key) : undefined;
          if (e && e.id === d.runnerLive) {
            lives.delete(d.key);
            giveLive(e.buffer, d.answer);
          }
          return;
        }
        if (d && typeof d.runnerFetched === "number" && waiting.has(d.runnerFetched)) {
          const off = waiting.get(d.runnerFetched);
          waiting.delete(d.runnerFetched);
          answer(String(d.url), d.bytes instanceof ArrayBuffer ? new Uint8Array(d.bytes) : null, off);
          return;
        }
        w.postMessage(d, Array.isArray(d?.files) ? [...new Set(d.files.map((f) => f?.[1]?.buffer).filter((b) => b instanceof ArrayBuffer))] : []);
      };
      port.postMessage({ runnerReady: true });
    } catch (err) {
      port.postMessage({ runnerError: String(err && err.message || err) });
    }
  });
})();
</script>
