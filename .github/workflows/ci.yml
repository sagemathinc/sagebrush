# Build pyjs and run its test suites on Node, Deno and Bun.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      # The conformance oracle is CPython 3.14 itself.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: SciPy (the reference for scipy.io's MATLAB files in test/data.test.ts)
        run: python3 -m pip install scipy
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --test 'dist/test/*.test.js' 'target/*.test.js'
      - name: the security tests with the attribute-read backstop off (SAGEBRUSH_HARDENED=0), so that path never rots
        run: SAGEBRUSH_HARDENED=0 node --test dist/test/security.test.js
      - name: single-file bundle
        run: node scripts/build-cli.mjs
      - name: the web page builds, and the npm packages in it are those in its notices
        run: |
          bun web/build.ts
          git diff --exit-code web/js-dependencies.json
          node scripts/build-cli.mjs
          node build/cli/pyjs.cjs --licenses | grep -q "JavaScript packages in the notebook page"
          node web/test-cli-assets.mjs build/cli/pyjs.cjs
      - name: shared collections (the share API and the files Worker in Miniflare; sharing from the page in headless Chrome)
        run: |
          (cd web/site && npm ci --silent)
          node web/share/test-share.mjs
          node web/test-engines.mjs
          CHROME=google-chrome node web/share/test-share-ui.mjs
      - name: the runner (Python in an opaque-origin sandboxed frame) in headless Chrome
        run: |
          python3 web/serve.py 8765 &
          sleep 1
          CHROME=google-chrome node web/test-runner.mjs
          CHROME=google-chrome node web/test-runner-files.mjs
          CHROME=google-chrome node web/board/test-frame.mjs
      - name: conformance (Node)
        run: python3 conformance/run.py --runtime node --show 20
      - name: conformance (Deno)
        run: python3 conformance/run.py --runtime deno --show 20
      - name: conformance (Bun)
        run: python3 conformance/run.py --runtime bun --show 20
      - name: .ipynb round trips keep metadata and raw cells
        run: node web/test-ipynb.mjs
      - name: TimeTravel and its Resume from here (the session recreated by replay), and ipywidgets, in headless Chrome
        run: |
          python3 web/serve.py 8765 &
          sleep 1
          CHROME=google-chrome node web/test-replay.mjs
          CHROME=google-chrome node web/test-timetravel.mjs
          CHROME=google-chrome node web/test-widgets.mjs
          CHROME=google-chrome node web/test-kernels.mjs
          CHROME=google-chrome node web/test-reactive.mjs
          CHROME=google-chrome node web/test-notebook-blocks.mjs
          CHROME=google-chrome node web/test-big-pictures.mjs
          CHROME=google-chrome node web/board/bench.mjs
          CHROME=google-chrome node web/test-board.mjs
          CHROME=google-chrome NO_EDIT=1 node web/test-board.mjs examples/primes.json
          CHROME=google-chrome NO_EDIT=1 node web/test-board.mjs examples/mermaid.md
          CHROME=google-chrome NO_EDIT=1 node web/test-board.mjs examples/source.json
          CHROME=google-chrome NO_EDIT=1 node web/test-board.mjs examples/integers.json
          CHROME=google-chrome node web/board/test-export.mjs
          CHROME=google-chrome node web/board/test-offline.mjs
          CHROME=google-chrome node web/board/test-ink-board.mjs
          CHROME=google-chrome node web/board/test-ink-draw.mjs
          CHROME=google-chrome node web/board/test-backdrop.mjs
          CHROME=google-chrome node web/board/test-present.mjs
          CHROME=google-chrome node web/board/test-templates.mjs
          CHROME=google-chrome node web/board/test-stickers.mjs
          CHROME=google-chrome node web/board/test-cached.mjs
          CHROME=google-chrome node web/board/test-code.mjs
          CHROME=google-chrome node web/board/test-outputs.mjs
          CHROME=google-chrome node web/board/test-images.mjs
          CHROME=google-chrome node web/board/test-mobile.mjs
          CHROME=google-chrome node web/board/test-inplace.mjs
          CHROME=google-chrome node web/board/test-blocks.mjs
          CHROME=google-chrome node web/board/test-history.mjs
          CHROME=google-chrome node web/board/test-history-order.mjs
          CHROME=google-chrome node web/board/test-cocalc.mjs
          CHROME=google-chrome node web/board/test-mount.mjs
          (cd packages/sagebrush-board && bun build.mjs && CHROME=google-chrome node test.mjs)
          CHROME=google-chrome node web/board/test-xss.mjs
          bun web/board/test-format.mjs
          bun web/board/test-canvas.mjs
          bun web/board/test-merge.mjs
          bun web/board/test-cached-store.mjs
          bun web/board/test-syncdb.mjs
          bun web/board/test-mermaid-export.mjs
          bun web/board/test-svg.mjs
          bun web/board/test-layout-speed.mjs
          bun web/board/test-history-speed.mjs
          bun web/board/test-preview.mjs
          bun web/board/test-outcache.mjs
          bun web/test-image-size.mjs
          bun web/board/test-ink.mjs
      - name: Mermaid flowcharts on boards, against Mermaid's own parser (its e2e and docs flowcharts)
        run: |
          git clone -q --depth 1 --branch mermaid@12.1.0 --filter=blob:none --sparse https://github.com/mermaid-js/mermaid.git /tmp/mermaid-src
          git -C /tmp/mermaid-src sparse-checkout set e2e packages/mermaid/src/docs/syntax
          mkdir -p /tmp/mm && (cd /tmp/mm && npm init -y >/dev/null && npm i --no-audit --no-fund mermaid@12.1.0 >/dev/null)
          MIN_SAME=0.97 CHROME=google-chrome node web/board/test-mermaid.mjs /tmp/mm /tmp/mermaid-src/e2e /tmp/mermaid-src/packages/mermaid/src/docs/syntax/flowchart.md
      - name: Sage mode (modular forms, elliptic curves), checked against Sage's output
        run: python3 sage-tests/run.py -v
      - name: symbolic calculus (limits, solve, taylor) in the WebAssembly engine
        run: python3 sage-tests/run_calculus.py
      - name: the Python package's copies of lib/ (and the 3D viewer's) are up to date
        run: scripts/sync-python-package.sh --check && node scripts/gen-viewer3d.mjs --check && node cdn/build.mjs --check
      - name: Magma mode (modular forms, elliptic curves), checked against Magma's output
        run: python3 magma-tests/run.py -v
      - name: MATLAB mode, checked against GNU Octave's output (and MATLAB's documented display)
        run: python3 matlab-tests/run.py -v
      - name: numpy, checked against NumPy itself
        # NumPy's AVX-512 kernels for exp/log/sin... differ from glibc's libm in
        # the last bit; sagebrush (like NumPy without AVX-512) follows glibc.
        env:
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          python3 -m pip install numpy==2.5.1
          python3 numpy-tests/run.py -v
      - name: mpmath test suite under CPython and pyjs
        run: |
          python3 -m pip install mpmath==1.3.0
          python3 bench/mpmath/compare.py -j 4

  # The math engine from source (audit F10): the jobs above use the committed
  # wasm/sagebrush-engine.wasm, so a change to engine/ is tested here, by its
  # own tests (optimized, with overflow checks) and by the same suites run on
  # a WebAssembly engine and a CPython extension freshly built from it.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # (the comparisons with FLINT, an LGPL reference, are sagebrush-oracle's:
      # they need FLINT installed and do not run here)
      - name: engine tests
        working-directory: engine
        run: cargo test --workspace --exclude sagebrush-flint --exclude sagebrush-oracle
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: a fresh WebAssembly engine
        run: |
          node scripts/build-engine.mjs
          node engine/web/tests/wasm_designated.mjs
          git diff --quiet wasm/ || echo "::warning::wasm/sagebrush-engine.wasm differs from a fresh build of engine/ (node scripts/build-engine.mjs; a different Rust can also change the bytes)"
      - run: pnpm install --frozen-lockfile
      - name: each package's third-party notices are up to date, and nothing (L)GPL is linked
        run: node scripts/third-party-notices.mjs --check
      - name: the TypeScript tests and the Sage, calculus, Magma and MATLAB suites on it
        run: |
          python3 -m pip install scipy
          pnpm run build
          node scripts/build-cli.mjs
          node --test 'dist/test/*.test.js'
          python3 sage-tests/run.py -v
          python3 sage-tests/run_calculus.py
          python3 magma-tests/run.py -v
          python3 matlab-tests/run.py -v
      - name: a fresh CPython extension, with the audit's regressions and Sage's tests
        run: |
          python3 -m pip install maturin
          (cd engine/py && maturin build --release --out dist)
          python3 -m pip install engine/py/dist/*.whl
          python3 engine/py/test_audit.py
          python3 sage-tests/run_cpython.py -v
