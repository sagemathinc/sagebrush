[package]
name = "sagebrush-app"
version = "0.3.2"
description = "Sagebrush: Python, Sage and Magma notebooks with Sagebrush's math engines"
authors = ["SageMath, Inc."]
license = "MIT OR Apache-2.0"
edition = "2021"

# (a library too: Android loads it as a shared library, iOS links it statically)
[lib]
name = "sagebrush_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl"] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"
sha2 = "0.10"
serde_json = "1"

# (the fs plugin: a phone's only, linked only there, since withGlobalTauri puts every linked plugin's
# window.__TAURI__ API on the page, registered or not; the desktop page reaches files by grants: src/disk.rs)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
