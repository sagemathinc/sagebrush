<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Whitespace · Sagebrush prototype</title>
<style>
  /* light by default (a white space); dark when the system is dark, or when chosen (Theme) */
  :root { color-scheme: light;
    --bg: #f5f6f8; --fg: #1f2328; --muted: #5f6b7a; --panel: rgba(255, 255, 255, 0.9); --line: #d5dbe3; --ctl: #ffffff; --ctl-line: #c9d1db; --hover: #eaeef3;
    --ov: #ffffff; --ov-fg: #1f2328; --ov-muted: #57606a; --ov-shadow: 0 10px 40px rgba(20, 30, 50, 0.18); --pre: #f0f2f5; --edit: #f6f8fa; --edit-line: #d0d7de;
    --out: #e7f6ec; --err: #ffebe9; --err-fg: #82071e; --link: #0b5cad; --ctl2: #eef1f5;
    --k: #cf222e; --t: #8250df; --s: #0a3069; --n: #0550ae; --c: #6e7781; --p: #24292f; --m: #953800; }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #0e1116; --fg: #e8eef7; --muted: #93a1b5; --panel: rgba(20, 24, 32, 0.88); --line: #2c3442; --ctl: #1b2130; --ctl-line: #364055; --hover: #253046;
    --ov: #161b22; --ov-fg: #e6edf3; --ov-muted: #8d96a0; --ov-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); --pre: #0d1117; --edit: #0d1117; --edit-line: #30363d;
    --out: #0f2a1b; --err: #3a1418; --err-fg: #ffa198; --link: #58a6ff; --ctl2: #21262d;
    --k: #ff7b72; --t: #d2a8ff; --s: #a5d6ff; --n: #79c0ff; --c: #8b949e; --p: #e6edf3; --m: #ffa657; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 320px; max-height: calc(100% - 60px); display: flex; flex-direction: column; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(20, 30, 50, 0.08); }
  .embed #panel { width: 260px; top: 8px; left: 8px; }
  .embed #space { display: none; }
  #title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #title a { color: var(--link); text-decoration: none; } #title a:hover { text-decoration: underline; }
  .head { display: flex; align-items: center; gap: 6px; }
  #fold { padding: 2px 9px; font-size: 13px; }
  /* folded (a phone's default): only the title, Back and the button that unfolds it */
  body.folded #panel > :not(.head) { display: none; }
  body.folded #panel { width: auto; max-width: calc(100% - 24px); padding: 6px 8px; }
  #alpha { position: fixed; left: 12px; bottom: 32px; z-index: 5; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px;
    background: #fff4d6; color: #6b4e00; border: 1px solid #e8d49a; cursor: help; }
  :root[data-theme="dark"] #alpha { background: #3a2f12; color: #f2d58a; border-color: #6b5520; }
  #status, #hover { color: var(--muted); font-size: 12px; min-height: 16px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  select, input, button { font: inherit; color: inherit; background: var(--ctl); border: 1px solid var(--ctl-line); border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; } button:hover { background: var(--hover); } button:disabled { opacity: 0.45; cursor: default; }
  select { flex: 1; } #q { width: 100%; box-sizing: border-box; }
  #results { list-style: none; margin: 0; padding: 0; overflow: auto; }
  #results li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  #results li:hover { background: var(--hover); }
  #results li b { display: block; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results li span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results li.none { color: var(--muted); cursor: default; }
  #overlay { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(560px, 46vw); overflow: auto; background: var(--ov); color: var(--ov-fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; box-shadow: var(--ov-shadow); }
  #overlay h2 { margin: 0 32px 10px 0; font-size: 18px; word-break: break-all; }
  #overlay .close { position: absolute; top: 10px; right: 10px; background: none; border: 0; color: var(--ov-muted); font-size: 22px; padding: 2px 8px; }
  #overlay pre { background: var(--pre); padding: 10px 12px; border-radius: 6px; overflow: auto; font: 12.5px/1.45 ui-monospace, Menlo, monospace; }
  #overlay pre.out { background: var(--out); }
  #overlay .label { margin-top: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ov-muted); }
  #overlay .meta, #overlay .hint { color: var(--ov-muted); font-size: 12px; }
  #overlay a { color: var(--link); }
  #overlay ul.links { margin: 4px 0; padding-left: 18px; } #overlay ul.links a { text-decoration: none; word-break: break-all; }
  #overlay .md code { background: var(--pre); padding: 1px 4px; border-radius: 4px; }
  #overlay .grip { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
  #overlay .grip:hover { background: rgba(11, 92, 173, 0.15); }
  #overlay .runbar { display: flex; gap: 6px; align-items: center; margin: 4px 0 8px; }
  #overlay .runbar select, #overlay .runbar button { background: var(--ctl2); color: var(--ov-fg); border: 1px solid var(--ctl-line); padding: 4px 10px; }
  #overlay .runbar button.run { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 600; }
  #overlay .runbar button:disabled { opacity: 0.5; }
  #overlay .runstate { color: var(--ov-muted); font-size: 12px; }
  #overlay .editor { position: relative; border: 1px solid var(--edit-line); border-radius: 6px; background: var(--edit); }
  #overlay .editor pre.hl, #overlay .editor textarea { margin: 0; padding: 10px 12px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
    word-break: break-word; tab-size: 4; border: 0; background: transparent; }
  #overlay .editor pre.hl { pointer-events: none; }
  #overlay .editor textarea { position: absolute; inset: 0; width: 100%; box-sizing: border-box; color: transparent; caret-color: var(--ov-fg); resize: none;
    outline: none; overflow: hidden; }
  #overlay .editor:focus-within { border-color: #1f6feb; box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.2); }
  #overlay pre.out.err { background: var(--err); color: var(--err-fg); }
  #overlay .summary { font-size: 14px; background: color-mix(in srgb, #1f6feb 9%, transparent); border-left: 3px solid #1f6feb; padding: 6px 10px; border-radius: 6px; margin: 4px 0 10px; }
  #overlay .summary p { margin: 0.2em 0; }
  #overlay .tourcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; background: color-mix(in srgb, #e3a008 10%, transparent); }
  #overlay .tourhead { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ov-muted); }
  #overlay .tourbar { display: flex; gap: 6px; margin-top: 6px; }
  #overlay .tourbar button { background: var(--ctl2); color: var(--ov-fg); border: 1px solid var(--ctl-line); padding: 4px 10px; }
  #overlay .tourbar button.next { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 600; }
  #tour { width: 100%; }
  #overlay .enterbar { display: flex; gap: 10px; align-items: center; margin: 2px 0 10px; }
  #overlay .enterbar button { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 600; padding: 5px 14px; }
  #overlay .noroom { margin: 2px 0 10px; padding: 6px 10px; border-radius: 6px; background: var(--ctl2); }
  #overlay a.ref { color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--link) 70%, transparent); text-underline-offset: 3px; }
  #overlay a.ref:hover { color: var(--link); text-decoration-style: solid; }
  #overlay img.fig { max-width: 100%; background: #fff; border-radius: 6px; margin: 6px 0; }
  /* highlight.js: GitHub's light and dark colors */
  .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-type, .hljs-built_in { color: var(--k); }
  .hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--t); }
  .hljs-string, .hljs-regexp, .hljs-meta .hljs-string { color: var(--s); }
  .hljs-number, .hljs-literal, .hljs-attr, .hljs-variable.language_, .hljs-symbol { color: var(--n); }
  .hljs-comment, .hljs-quote { color: var(--c); font-style: italic; }
  .hljs-params { color: var(--p); } .hljs-meta { color: var(--m); }
  /* narrow (the agents chat's pane): an open object hides the panel and the help, so the space stays in view */
  @media (max-width: 1000px) {
    body.reading #panel, #help { display: none; }
    #alpha { bottom: 10px; left: 8px; }
    #overlay { width: min(560px, 55vw); }
  }
  #help { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
  /* a phone: the drawer is a sheet over the lower part of the screen, the space in view above it */
  @media (max-width: 700px) {
    #overlay { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto !important; height: 52vh; padding: 14px 16px; }
    #overlay .grip { display: none; }
    body.reading #panel { display: flex; width: auto; padding: 6px 8px; }
    body.reading #panel > :not(.head) { display: none; } /* (while reading, folded: the title and Back stay) */
    #alpha { display: none; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <div class="head">
    <button id="back" title="Back to where you were (B); out of a room, past where you entered it" disabled>←</button>
    <div id="title">Whitespace</div>
    <button id="fold" title="Hide the controls (show them again with this button)" aria-expanded="true">▴</button>
  </div>
  <div class="row"><select id="space" title="The space shown"></select></div>
  <div class="row">
    <button id="fwd" title="Forward again (F)" disabled>Forward →</button>
    <button id="home" title="See everything (H)">See all</button>
    <button id="dims" title="The same space laid out on a plane, to compare">Flatten to 2D</button>
    <button id="fs" title="Full screen">Full screen</button>
    <button id="vr" hidden title="Into the space, in a headset (Meta Quest and others)">Enter VR</button>
    <button id="ar" hidden title="The space in your room, through the headset's passthrough">Enter AR</button>
    <button id="runall" title="Run every object's code, one after another">Run all</button>
    <button id="theme" title="Light, dark, or as your system is (Auto)">Theme: Auto</button>
  </div>
  <select id="tour" hidden title="Guided tours through this space: each stop says what to look at"></select>
  <input id="q" type="search" placeholder="Search everything (press /)" autocomplete="off">
  <ul id="results"></ul>
  <div id="hover"></div>
  <div id="status"></div>
</div>
<div id="overlay" hidden></div>
<div id="alpha" title="A quick prototype: not reviewed, and it will change. Spaces you make may not open in a later version.">Whitespace · rough alpha</div>
<div id="help">Drag to turn · scroll to move closer · right-drag to pan · W A S D / arrows, E Q: fly (Shift: faster) · click an object to read it · Enter: into a directory, file or class · B / F: back, forward · H: see all · /: search</div>
<script type="module" src="space.js"></script>
</body>
</html>
