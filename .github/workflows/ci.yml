# Fast pull-request CI and the full master/nightly audit.
name: ci

env:
  SAGEBRUSH_CPUS_OVERRIDE: ${{ vars.CI_CPUS }}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    if: github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      app_only: ${{ steps.paths.outputs.app_only }}
      node: ${{ steps.paths.outputs.node }}
      web: ${{ steps.paths.outputs.web }}
      modes: ${{ steps.paths.outputs.modes }}
      engine_smoke: ${{ steps.paths.outputs.engine_smoke }}
      engine_full: ${{ steps.paths.outputs.engine_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git diff --check
      - uses: oven-sh/setup-bun@v2
      - name: core imports no server code (plan-cloud-split-r1)
        run: bun scripts/test-check-no-server-imports.mjs && bun scripts/check-no-server-imports.mjs
      - id: paths
        name: classify changed paths and select the tier
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-paths.mjs >> "$GITHUB_OUTPUT"

  node-tests:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Node tests, shard ${{ matrix.shard }}/8
        env:
          SAGEBRUSH_TIME_SCALE: "2"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          mapfile -d '' files < <(find dist/test target -maxdepth 1 -type f -name '*.test.js' ! -name 'magma.test.js' ! -name 'matlab.test.js' -print0 | sort -z)
          node --test --test-concurrency="$SAGEBRUSH_CPUS" --test-shard=${{ matrix.shard }}/8 "${files[@]}"

  language-node:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build
      - name: Magma and MATLAB Node tests, case shard ${{ matrix.shard }}/6
        env:
          SAGEBRUSH_TIME_SCALE: "2"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          node scripts/test-name-shard.mjs test/magma.test.ts dist/test/magma.test.js ${{ matrix.shard }}/6
          node scripts/test-name-shard.mjs test/matlab.test.ts dist/test/matlab.test.js ${{ matrix.shard }}/6

  checks:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && (needs.changes.outputs.node == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: security, bundles, generated files and web assets
        run: |
          SAGEBRUSH_HARDENED=0 node --test --test-concurrency="$SAGEBRUSH_CPUS" dist/test/security.test.js
          node scripts/build-cli.mjs
          node web/test-cli-sigint.mjs
          bun web/build.ts
          git diff --exit-code web/js-dependencies.json
          node scripts/build-cli.mjs
          node build/cli/pyjs.cjs --licenses | grep -q "JavaScript packages in the notebook page"
          node web/test-cli-assets.mjs build/cli/pyjs.cjs
          node web/test-app-frontend.mjs
          node web/test-llms.mjs
          node web/test-alpha-banner.mjs
          node web/test-ipynb.mjs
          node scripts/third-party-notices.mjs --check
          node scripts/packages.mjs --check
          node scripts/pypi-import.mjs --check
          node scripts/tzdata-import.mjs --check
          scripts/sync-python-package.sh --check
          node scripts/gen-viewer3d.mjs --check
          node cdn/build.mjs --check
          node scripts/board-format-schema.mjs --check
      - name: Mermaid flowcharts against Mermaid's parser
        run: |
          mermaid_src="$(mktemp -d "${RUNNER_TEMP}/sagebrush-mermaid-src.XXXXXX")"
          mermaid_npm="$(mktemp -d "${RUNNER_TEMP}/sagebrush-mermaid-npm.XXXXXX")"
          trap 'rm -rf "$mermaid_src" "$mermaid_npm"' EXIT
          git clone -q --depth 1 --branch mermaid@12.1.0 --filter=blob:none --sparse https://github.com/mermaid-js/mermaid.git "$mermaid_src"
          git -C "$mermaid_src" sparse-checkout set e2e packages/mermaid/src/docs/syntax
          (cd "$mermaid_npm" && npm init -y >/dev/null && npm i --no-audit --no-fund mermaid@12.1.0 >/dev/null)
          MIN_SAME=0.97 CHROME=google-chrome node web/board/test-mermaid.mjs "$mermaid_npm" "$mermaid_src/e2e" "$mermaid_src/packages/mermaid/src/docs/syntax/flowchart.md"

  web-sync:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: sharing, sync, engines and PWA
        run: |
          (cd web/site && npm ci --silent)
          (cd web/test-workers && npm ci --silent)
          node web/share/test-share.mjs
          node web/sync/test-sync.mjs
          CHROME=google-chrome node web/workspace/test-workspace-sync-client.mjs
          bun web/sync/test-inventory.mjs
          bun web/workspace/test-sync-reduce.mjs
          bun web/sync-protocol/test-doc-protocol.mjs
          python3 -I web/sync-protocol/gen-doc-vectors.py | diff - web/sync-protocol/doc-vectors.json
          node web/test-engines.mjs
          CHROME=google-chrome node web/test-pwa-update.mjs
          CHROME=google-chrome node web/test-pwa-first-visit.mjs
          CHROME=google-chrome node web/share/test-share-ui.mjs
          bun web/test-no-site-build.mjs
          bun web/test-reproducible-build.mjs

  web-runner:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: runner, workspace and board frame
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          CHROME=google-chrome node web/test-runner.mjs
          CHROME=google-chrome node web/test-runner-files.mjs
          CHROME=google-chrome node web/test-catalog.mjs
          CHROME=google-chrome node web/board/test-frame.mjs
          CHROME=google-chrome bun web/board/test-submit.mjs
          CHROME=google-chrome bun web/board/test-submit-ids.mjs
          CHROME=google-chrome bun web/board/test-frame-edit.mjs
          CHROME=google-chrome bun web/workspace/test-workspace.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-crash.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-crash-v4.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-outbox.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-outbox-855.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-pins.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-9c2.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-fef.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-12e.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-6b7.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-ac1.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-ac1-trash.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-sync-ops-1f3.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-detect.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-9d7.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-c05.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-896.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-d76.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-be4.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-be4-idb.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-529.mjs
          bun web/notebook/test-json-text.mjs
          CHROME=google-chrome bun web/workspace/test-workspace-migrate-time.mjs
          CHROME=google-chrome node web/workspace/test-workspace-pages.mjs
          CHROME=google-chrome node web/workspace/test-workspace-browser.mjs
          CHROME=google-chrome node web/workspace/test-workspace-preview.mjs
          CHROME=google-chrome node web/workspace/test-workspace-filemenu.mjs
          CHROME=google-chrome node web/workspace/test-workspace-upload.mjs
          bun web/board/test-own-names.mjs
          bun web/board/test-edit-state.mjs
          bun web/board/test-edit-channel.mjs
          bun web/board/test-edit-pictures.mjs
          CHROME=google-chrome node web/board/test-idb-stall.mjs
          node web/board/test-idb-within.mjs

  web-browser:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [notebook, board-a, board-b, board-c, board-unit]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        if: matrix.group == 'board-unit'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: browser group ${{ matrix.group }}
        env:
          CHROME: google-chrome
          GROUP: ${{ matrix.group }}
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          case "$GROUP" in
            notebook)
              node web/test-replay.mjs
              node web/test-timetravel.mjs
              node web/test-widgets.mjs
              node web/test-graph-view.mjs
              node web/test-kernels.mjs
              node web/test-time.mjs
              node web/test-reactive.mjs
              node web/test-notebook-blocks.mjs
              node web/test-doclang.mjs
              node web/test-big-pictures.mjs
              node web/test-png.mjs
              ;;
            board-a)
              node web/board/bench.mjs
              node web/test-board.mjs
              NO_EDIT=1 node web/test-board.mjs examples/primes.json
              NO_EDIT=1 node web/test-board.mjs examples/mermaid.md
              NO_EDIT=1 node web/test-board.mjs examples/source.json
              NO_EDIT=1 node web/test-board.mjs examples/integers.json
              node web/board/test-export.mjs
              node web/board/test-offline.mjs
              node web/board/test-ink-board.mjs
              node web/board/test-ink-draw.mjs
              node web/board/test-backdrop.mjs
              node web/board/test-present.mjs
              node web/board/test-tour.mjs
              ;;
            board-b)
              node web/board/test-templates.mjs
              node web/board/test-stickers.mjs
              node web/board/test-cached.mjs
              node web/board/test-code.mjs
              node web/board/test-modes.mjs
              node web/board/test-engine-start.mjs
              node web/board/test-outputs.mjs
              node web/board/test-images.mjs
              node web/board/test-mobile.mjs
              node web/board/test-inplace.mjs
              node web/board/test-addsame.mjs
              node web/board/test-ask.mjs
              ;;
            board-c)
              node web/board/test-find.mjs
              node web/board/test-titles.mjs
              node web/board/test-fit.mjs
              node web/board/test-local.mjs
              node web/board/test-links.mjs
              node web/board/test-version.mjs
              node web/board/test-blocks.mjs
              node web/board/test-history.mjs
              node web/board/test-history-order.mjs
              node web/board/test-cocalc.mjs
              node web/board/test-mount.mjs
              node web/board/test-xss.mjs
              ;;
            board-unit)
              (cd packages/sagebrush-board && bun build.mjs && node test.mjs)
              bun web/board/test-format.mjs
              bun web/notebook/test-kernel-evaluate.mjs
              bun web/notebook/test-runner-fallback.mjs
              bun web/board/test-canvas.mjs
              bun web/board/test-channel.mjs
              bun web/board/test-merge.mjs
              bun web/board/test-cached-store.mjs
              bun web/board/test-complete.mjs
              bun web/board/test-syncdb.mjs
              bun web/board/test-mermaid-export.mjs
              bun web/board/test-fromhtml.mjs
              bun web/board/test-svg.mjs
              bun web/board/test-layout-speed.mjs
              bun web/board/test-graph.mjs
              bun web/graph/test-spring.mjs
              bun web/board/test-route.mjs
              bun web/board/test-history-speed.mjs
              bun web/board/test-preview.mjs
              bun web/board/test-outcache.mjs
              bun web/test-image-size.mjs
              bun web/test-lib-chunks.mjs
              bun web/board/test-ink.mjs
              ;;
          esac

  conformance:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno, bun]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - run: python3 conformance/run.py --runtime ${{ matrix.runtime }} --show 20
      - name: catalog examples and coverage
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then
            node dist/src/cli.js -m _catalog --coverage
          else
            python3 scripts/catalog-run.py --runtime "${{ matrix.runtime }}"
          fi

  modes:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.modes == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [sage, magma-matlab, numeric, aux]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1 mpmath==1.3.0
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: mode group ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          case "$GROUP" in
            sage) python3 sage-tests/run.py -v ;;
            magma-matlab)
              python3 magma-tests/run.py -v
              python3 matlab-tests/run.py -v
              ;;
            numeric)
              python3 numpy-tests/run.py -v
              python3 scipy-tests/run.py -v
              python3 bench/mpmath/compare.py -j "$SAGEBRUSH_CPUS"
              ;;
            aux)
              python3 pypi-tests/run.py
              python3 sage-tests/run_calculus.py
              ;;
          esac

  engine-rust:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_smoke == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - working-directory: engine
        run: cargo test --workspace --exclude sagebrush-flint --exclude sagebrush-oracle

  engine-wasm:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_smoke == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile
      - name: build and smoke-test a fresh WebAssembly engine
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          node scripts/build-engine.mjs
          node engine/web/tests/wasm_designated.mjs
          git diff --quiet wasm/ || echo "::warning::wasm/sagebrush-engine.wasm differs from a fresh build of engine/"
          node scripts/third-party-notices.mjs --check
          pnpm run build
          node scripts/build-cli.mjs
          node --test --test-concurrency="$SAGEBRUSH_CPUS" dist/test/groups.test.js dist/test/kernels.test.js dist/test/mpfield-matrix.test.js dist/test/special.test.js dist/test/sage.test.js dist/test/scipy-integrate.test.js
          python3 sage-tests/run_calculus.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-wasm-${{ github.sha }}
          path: wasm/sagebrush-engine.wasm
          retention-days: 3

  engine-node:
    needs: [changes, engine-wasm]
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: actions/download-artifact@v4
        with:
          name: fresh-wasm-${{ github.sha }}
          path: wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Node tests on the fresh engine, shard ${{ matrix.shard }}/8
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          mapfile -d '' files < <(find dist/test -maxdepth 1 -type f -name '*.test.js' ! -name 'magma.test.js' ! -name 'matlab.test.js' -print0 | sort -z)
          node --test --test-concurrency="$SAGEBRUSH_CPUS" --test-shard=${{ matrix.shard }}/8 "${files[@]}"

  engine-language:
    needs: [changes, engine-wasm]
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: actions/download-artifact@v4
        with:
          name: fresh-wasm-${{ github.sha }}
          path: wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Magma and MATLAB Node tests on the fresh engine, case shard ${{ matrix.shard }}/6
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          node scripts/test-name-shard.mjs test/magma.test.ts dist/test/magma.test.js ${{ matrix.shard }}/6
          node scripts/test-name-shard.mjs test/matlab.test.ts dist/test/matlab.test.js ${{ matrix.shard }}/6

  engine-modes:
    needs: [changes, engine-wasm]
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: actions/download-artifact@v4
        with:
          name: fresh-wasm-${{ github.sha }}
          path: wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Sage, calculus, Magma and MATLAB on the fresh engine
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          python3 sage-tests/run.py -v
          python3 sage-tests/run_calculus.py
          python3 magma-tests/run.py -v
          python3 matlab-tests/run.py -v

  engine-cpython:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python3 -m pip install maturin
      - name: CPython extension, audit regressions, MCP and Sage
        run: |
          (cd engine/py && maturin build --release --out dist)
          python3 -m pip install engine/py/dist/*.whl
          python3 engine/py/test_audit.py
          python3 engine/py/test_certify.py
          python3 engine/py/test_bench.py
          python3 engine/py/test_mcp.py
          python3 engine/py/test_workspace_tools.py
          python3 engine/py/test_pairing.py
          python3 engine/py/test_chat.py
          python3 sage-tests/run_cpython.py -v

  ci:
    if: always() && (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '')
    needs:
      - changes
      - node-tests
      - language-node
      - checks
      - web-sync
      - web-runner
      - web-browser
      - conformance
      - modes
      - engine-rust
      - engine-wasm
      - engine-node
      - engine-language
      - engine-modes
      - engine-cpython
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: require every selected job to pass
        env:
          RESULTS: >-
            ${{ needs.changes.result }} ${{ needs.node-tests.result }}
            ${{ needs.language-node.result }}
            ${{ needs.checks.result }} ${{ needs.web-sync.result }}
            ${{ needs.web-runner.result }} ${{ needs.web-browser.result }}
            ${{ needs.conformance.result }} ${{ needs.modes.result }}
            ${{ needs.engine-rust.result }} ${{ needs.engine-wasm.result }}
            ${{ needs.engine-node.result }} ${{ needs.engine-language.result }}
            ${{ needs.engine-modes.result }}
            ${{ needs.engine-cpython.result }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
