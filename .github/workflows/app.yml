# The desktop app (app/, Tauri 2): its web page is built once, then the app
# for macOS (Apple silicon), Linux and Windows.  Each app runs its self-test
# (app/selftest) in that platform's web view, and the installers are kept as
# artifacts (not signed yet).
name: app

on:
  push:
    paths: ["app/**", "web/**", "src/**", "lib/**", "wasm/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/build-cli.mjs
      - run: bun web/build.ts
      - run: node app/build-frontend.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: app-page
          path: app/dist

  app:
    needs: page
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            exe: app/src-tauri/target/release/sagebrush-app
          - os: ubuntu-22.04
            exe: app/src-tauri/target/release/sagebrush-app
          - os: windows-latest
            exe: app/src-tauri/target/release/sagebrush-app.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-page
          path: app/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm install -g @tauri-apps/cli@^2
      - name: build
        working-directory: app/src-tauri
        run: tauri build --ci
      - name: self-test (Linux, in a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node app/selftest/run.mjs ${{ matrix.exe }}
      # GTK's TIFF loader brings libtiff and libjbig (GPL-2+): removed, and
      # the stripped AppImage itself self-tested (DIST-F1)
      - name: strip the TIFF loader from the AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL=/tmp/appimagetool sh app/strip-appimage.sh app/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: self-test the stripped AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: xvfb-run -a node app/selftest/run.mjs $(ls app/src-tauri/target/release/bundle/appimage/*.AppImage)
      - name: self-test
        if: runner.os != 'Linux'
        run: node app/selftest/run.mjs ${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sagebrush-app-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
