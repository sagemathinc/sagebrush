[package]
name = "sagebrush-classgroup"
version = "0.1.0"
edition = "2021"
description = "Class groups of number fields, starting with imaginary quadratic fields (clean-room, MIT/Apache-2.0)"
license = "MIT OR Apache-2.0"

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-ball = { path = "../ball" }
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-ledger = { path = "../ledger" }
num-integer = "0.1"
num-traits = "0.2"
sagebrush-poly = { path = "../poly" }
sagebrush-arith = { path = "../arith", default-features = false }

[dev-dependencies]
# (tests only: a fake usage row, so a refusal mid-run comes at a fixed place)
sagebrush-ledger = { path = "../ledger", features = ["test-hooks"] }
# (the LLL benchmark examples drive the unbudgeted L^2 entries)
sagebrush-poly = { path = "../poly", features = ["bench"] }
# (the hermite meter test counts the Stop checks)
sagebrush-interrupt = { path = "../interrupt", features = ["test-hooks"] }
# (hnf_mod's extended gcd with the fallback forced, tests/hnf_mod_xgcd_charge.rs)
sagebrush-bigint = { path = "../bigint", features = ["test-hooks"] }

[lints]
workspace = true
