[workspace]
resolver = "2"
members = ["interrupt", "ledger", "par", "bigint", "ball", "arith", "mpoly", "group", "galois", "sym", "modsym", "hmf", "ap", "poly", "classgroup", "flint", "oracle", "cli", "py", "node", "web", "raster", "wasmheap", "growth-probe", "nd", "mp"]

# Unsafe code is the trusted boundary of the engine ledger's safe-Rust proof
# (no-cliffs C-2c-ii scope r4 section 1.3): denied everywhere; each existing
# site carries an allow on its smallest enclosing item, pinned by
# test/unsafe-allow-inventory.json (scripts/unsafe-inventory.mjs).
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Tests run optimized (the exact tests do real work) but keep overflow checks.
[profile.test]
opt-level = 3

# dashu from Sagebrush's fork (github.com/sagemathinc/dashu, MIT OR Apache-2.0),
# pinned to a reviewed commit of its master: upstream plus the fused
# multiply-add (design/bigint-plan.md, sections 9 and 11)
[patch.crates-io]
dashu-int = { git = "https://github.com/sagemathinc/dashu", rev = "3973a3e7aee505b637c3fa14823eeaec2da68a1f" }
dashu-base = { git = "https://github.com/sagemathinc/dashu", rev = "3973a3e7aee505b637c3fa14823eeaec2da68a1f" }
