name: pypi-mcp

# The thin `sagebrush-mcp` package (engine/py-mcp: an entry point over
# sagebrush.mcp_server).  A manual run builds and tests; a release tag `vX.Y.Z`
# also publishes to PyPI by trusted publishing (publisher: this repository,
# workflow `pypi-mcp.yml`, environment `pypi`).  It depends on sagebrush at its
# own version, which pypi.yml publishes from the same tag, so the build waits
# until PyPI has that version before installing and testing against it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  actions: read # verify the tagged commit's full CI before publishing
  contents: read

jobs:
  build:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    # (pypi.yml's wheels, floor and publish for the same tag come first: the wait below is most of this)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-versions.mjs "$GITHUB_REF_NAME"
      # (as release.yml: a release tag publishes only a commit whose full ci.yml run on master is green)
      - name: require green full CI for the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and .head_branch == "master")] | length')
          [ "$ok" -gt 0 ] || { echo "No successful full ci.yml run on master for $GITHUB_SHA"; exit 1; }
      - name: wait for this version of sagebrush on PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 100); do
            if python -m pip download -q --no-deps --dest /tmp/sb "sagebrush==$v" 2>/dev/null; then echo "sagebrush $v is on PyPI"; exit 0; fi
            sleep 60
          done
          echo "sagebrush $v isn't on PyPI after 100 minutes: see pypi.yml's run for this tag"; exit 1
      # (on a tag, against exactly the sagebrush that tag published, the wheel downloaded above, not the newest one
      # PyPI has: `sagebrush>=X` alone could resolve to a later release)
      - name: build and test
        run: |
          python -m pip install build
          python -m build engine/py-mcp --outdir dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python -m pip install /tmp/sb/sagebrush-*.whl dist/*.whl
            python -c "import importlib.metadata as m, sys; v = m.version('sagebrush'); sys.exit(0 if v == '${GITHUB_REF_NAME#v}' else 'sagebrush installed is %s, not the tag\'s' % v)"
          else
            python -m pip install dist/*.whl
          fi
          python engine/py/test_mcp.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/*

  publish:
    if: github.repository == 'sagemathinc/sagebrush' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
