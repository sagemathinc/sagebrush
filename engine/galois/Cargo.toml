[package]
name = "sagebrush-galois"
version = "0.1.0"
edition = "2021"
description = "Galois groups of polynomials over Q: Frobenius cycle types, p-adic roots and Stauduhar descent through our own tables of transitive groups (clean-room, MIT/Apache-2.0)"
license = "MIT OR Apache-2.0"

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-group = { path = "../group" }
sagebrush-poly = { path = "../poly" }
sagebrush-interrupt = { path = "../interrupt" }
num-integer = "0.1"
num-traits = "0.2"
