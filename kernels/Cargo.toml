[package]
name = "sagebrush-kernels"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly SIMD kernels (matmul, LU) for sagebrush's numpy"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# set by kernels/relaxed, which includes src/libm.rs
relaxed = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace]
