name: pypi-mcp

# The thin `sagebrush-mcp` package (engine/py-mcp: an entry point over
# sagebrush.mcp_server).  A manual run builds and tests; an `mcp-v*` tag also
# publishes to PyPI by trusted publishing (publisher: this repository,
# workflow `pypi-mcp.yml`, environment `pypi`).

on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: build and test
        run: |
          python -m pip install build
          python -m build engine/py-mcp --outdir dist
          python -m pip install dist/*.whl
          python engine/py/test_mcp.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/*

  publish:
    if: github.repository == 'sagemathinc/sagebrush' && startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
