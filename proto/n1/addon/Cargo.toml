# #825 N1 prototype only (branch n1-native-proto, never merged): engine/web's JSON ABI as an N-API add-on,
# with the host-word Stop (no SIGINT handler) and the E3 binary-format experiment.
[package]
name = "sagebrush-n1-addon"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sagebrush-web = { path = "../../../engine/web" }
sagebrush-sym = { path = "../../../engine/sym" }
sagebrush-mpoly = { path = "../../../engine/mpoly" }
sagebrush-ap = { path = "../../../engine/ap" }
sagebrush-arith = { path = "../../../engine/arith" }
sagebrush-bigint = { path = "../../../engine/bigint" }
sagebrush-interrupt = { path = "../../../engine/interrupt", features = ["host-word"] }
serde_json = "1"
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
