# Fast pull-request CI and the full master/nightly audit.
name: ci

env:
  SAGEBRUSH_CPUS_OVERRIDE: ${{ vars.CI_CPUS }}
  # (a stalled cache download (setup-* and actions/cache restores, @actions/cache's segment timeout) gives up as a
  # cache miss after 2 minutes instead of the default 10: #381's attempts 1 and 2 lost 10 minutes of each job's budget
  # to it while the account's cache egress was over its limit, and jobs hit their timeouts)
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

on:
  push:
    branches: [master]
  pull_request:
    # (labeled: adding the full-ci label reruns the pull request on the full tier)
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

# A pull request's new revision cancels its obsolete run.  On master a run in
# progress is never cancelled: it finishes, and of the pushes queued behind it
# only the newest runs next (GitHub replaces an older pending run in the group).
# So while merges come faster than a full run takes, every cycle still ends in
# a master commit with a completed run, which the deploy script requires
# (cancelling in progress left no master commit with one: Nov 2, cloud #91's
# core c26ead62), at about the same cost.  The schedule and a dispatch are
# groups of their own, so a merge never displaces them; a dispatch's group is
# its commit's, so a dispatch on another commit (a release's, say) doesn't either.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    if: github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      app_only: ${{ steps.paths.outputs.app_only }}
      node: ${{ steps.paths.outputs.node }}
      web: ${{ steps.paths.outputs.web }}
      modes: ${{ steps.paths.outputs.modes }}
      engine_smoke: ${{ steps.paths.outputs.engine_smoke }}
      engine_full: ${{ steps.paths.outputs.engine_full }}
      wasm_build: ${{ steps.paths.outputs.wasm_build }}
      engine_cpython: ${{ steps.paths.outputs.engine_cpython }}
      webkit: ${{ steps.paths.outputs.webkit }}
      web_groups: ${{ steps.paths.outputs.web_groups }}
      web_runner: ${{ steps.paths.outputs.web_runner }}
      web_export: ${{ steps.paths.outputs.web_export }}
      web_lookalike: ${{ steps.paths.outputs.web_lookalike }}
      web_share: ${{ steps.paths.outputs.web_share }}
      census: ${{ steps.paths.outputs.census }}
      unsafe_sweep: ${{ steps.paths.outputs.unsafe_sweep }}
      slow_tests: ${{ steps.paths.outputs.slow_tests }}
      slow_scope: ${{ steps.paths.outputs.slow_scope }}
      size_inputs: ${{ steps.paths.outputs.size_inputs }}
      examples_ids: ${{ steps.paths.outputs.examples_ids }}
      examples_matrix: ${{ steps.paths.outputs.examples_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: git diff --check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: core imports no server code (plan-cloud-split-r1)
        run: bun scripts/test-check-no-server-imports.mjs && bun scripts/check-no-server-imports.mjs
      # (here, in the one job every ci run has, so a change to ANY workflow is
      # checked: ci.yml has no paths filter and this job no tier condition)
      - name: every action pinned to a commit (scripts/check-action-pins.mjs, on its fixtures first)
        run: bun scripts/test-check-action-pins.mjs && bun scripts/check-action-pins.mjs
      # (the suites name their jobs in "// ci:" headers, not the workflows: a suite without one, or a target no
      # workflow runs, fails here, in the job every run has)
      - name: test discovery (scripts/web-tests.mjs check)
        run: node scripts/web-tests.mjs check
      - id: paths
        name: classify changed paths and select the tier
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          CI_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/ci-paths.mjs >> "$GITHUB_OUTPUT"

  # (the limits census alone, in seconds and with no build: it must run on an
  # engine-only pull request too, whose node suites are path-skipped; #155)
  census:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.census == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: "limits census: every census-vocabulary site registered, the baseline the seed's (test/limit_sites.py --check)"
        run: |
          python3 test/limit_sites.py --check > census.json || { cat census.json; exit 1; }
          pinned=$(sed -n 's/^const LIMIT_SITES_BASELINE_SHA256 = "\([0-9a-f]*\)";$/\1/p' test/limits.test.ts)
          python3 -c 'import json, sys; d = json.load(open("census.json")); print(json.dumps({k: d[k] for k in ("sites", "registered", "explained", "active_baseline", "problems")})); sys.exit(0 if d["baseline_sha256"] == sys.argv[1] and d["explained"] >= 17 else 1)' "$pinned"
      # (the baseline sweep: its manifest rebuilt from the commit it names, fetched if this shallow checkout lacks it, and its tooling's fixture cases)
      - name: "limits sweep: the manifest is the one rebuilt from its revision, and the tooling's fixture cases pass (test/limit_sweep.py)"
        run: |
          python3 test/limit_sweep.py verify
          python3 test/limit_sweep_cases.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: "unsafe boundary: every allowed unsafe item pinned and audited, no lint override (scripts/unsafe-inventory.mjs)"
        run: |
          node scripts/web-tests.mjs run census
          node scripts/unsafe-inventory.mjs --check

  node-tests:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.node == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # (test/kedlaya.test.ts checks the JavaScript engine detection under Deno too)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Node tests, shard ${{ matrix.shard }}/8
        env:
          SAGEBRUSH_TIME_SCALE: "2"
          # (the slow tests, test/slow-tests.ts: for the full-ci label and the paths they test, scripts/ci-paths.mjs
          # slow_scope, 1 for all of them, arraybuffer for the census parity and train-16 alone; the schedule and a
          # dispatch run them anyway. Not in engine-node)
          SAGEBRUSH_SLOW_TESTS: ${{ needs.changes.outputs.slow_scope }}
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          mapfile -d '' files < <(find dist/test target -maxdepth 1 -type f -name '*.test.js' ! -name 'magma.test.js' ! -name 'matlab.test.js' ! -name 'sprig*.test.js' -print0 | sort -z)
          node --test --test-concurrency="$SAGEBRUSH_CPUS" --test-shard=${{ matrix.shard }}/8 "${files[@]}"
      # (read-only memory telemetry for #1031: the cgroup this step runs in, which is the whole job so far, its
      # install, build and every test of the shard, not the parity test alone; printed even when a step before failed;
      # a file that is missing or unreadable is printed as unavailable, never as 0)
      - name: memory telemetry, this job's cgroup
        if: always()
        run: |
          show() { echo "== $1"; if [ -r "$1" ]; then cat "$1"; else echo unavailable; fi; }
          show /proc/self/cgroup
          cg=$(sed -n 's/^0:://p' /proc/self/cgroup 2>/dev/null)
          for f in memory.peak memory.max memory.events; do show "/sys/fs/cgroup${cg}/$f"; done
          echo "== MemTotal"
          grep '^MemTotal:' /proc/meminfo || echo unavailable

  # (Sprig's suites in their own job, so its corpus and memory pins don't push a
  # node-tests shard past 10 minutes; node-tests and engine-node exclude sprig* in
  # their own find lines, keep the three in step. Sprig suites are only in dist/test, not target/)
  sprig:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && (needs.changes.outputs.node == 'true' || needs.changes.outputs.engine_full == 'true')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Sprig Node tests
        env:
          SAGEBRUSH_TIME_SCALE: "2"
        run: |
          mapfile -d '' files < <(find dist/test -maxdepth 1 -type f -name 'sprig*.test.js' -print0 | sort -z)
          # (master has Sprig suites since #903: none found means the build or the pattern broke)
          if [ "${#files[@]}" -eq 0 ]; then echo "no Sprig suites: the build or the pattern is wrong"; exit 1; fi
          node --test --test-concurrency="$SAGEBRUSH_CPUS" "${files[@]}"

  language-node:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.node == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build
      - name: Magma and MATLAB Node tests, case shard ${{ matrix.shard }}/6
        env:
          SAGEBRUSH_TIME_SCALE: "2"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          node scripts/test-name-shard.mjs test/magma.test.ts dist/test/magma.test.js ${{ matrix.shard }}/6
          node scripts/test-name-shard.mjs test/matlab.test.ts dist/test/matlab.test.js ${{ matrix.shard }}/6

  checks:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && (needs.changes.outputs.node == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.size_inputs == 'true')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      # (pinned: heap-budget.json records the load heap V8 reports, which
      # differs between Node versions; move this pin and re-record in one PR)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      # (pinned: size-budget.json records exact bytes, and bun's output differs
      # between releases; move this pin and re-record the budget in one PR)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: security, bundles, generated files and web assets
        run: |
          SAGEBRUSH_HARDENED=0 node --test --test-concurrency="$SAGEBRUSH_CPUS" dist/test/security.test.js
          node scripts/build-cli.mjs
          node scripts/web-tests.mjs run checks.1
          node scripts/bench-ff-limits.mjs
          bun web/build.ts
          # (the export's lazy chunk and worker, each within its reviewed ceiling, tightly: E1, daybreak2's E1-D2-2)
          node scripts/check-export-size.mjs
          node scripts/web-tests.mjs run checks.2
          git diff --exit-code web/js-dependencies.json
          node scripts/build-cli.mjs
          node build/cli/pyjs.cjs --licenses | grep -q "JavaScript packages in the notebook page"
          # (the offline catalog's own gate, plan-b8-offline §3: its eight rows on the build above, and their controls)
          node scripts/web-tests.mjs run checks.3
          node scripts/offline-size-gate.mjs --check
          node scripts/web-tests.mjs run checks.4
          node scripts/third-party-notices.mjs --check
          node scripts/packages.mjs --check
          node scripts/web-tests.mjs run checks.5
          node scripts/core-api-surface.mjs --check
          node scripts/size-budget.mjs --check
          node scripts/web-tests.mjs run checks.6
          node scripts/heap-budget.mjs --check
          node scripts/pypi-import.mjs --check
          node scripts/tzdata-import.mjs --check
          scripts/sync-python-package.sh --check
          node scripts/gen-viewer3d.mjs --check
          node cdn/build.mjs --check
          node scripts/check-engine-module.mjs --self-test
          # (the committed, shipped module; engine-wasm checks its fresh build, which overwrites it there)
          node scripts/check-engine-module.mjs wasm/sagebrush-engine.wasm
          node scripts/board-format-schema.mjs --check
          # (the architecture article: its links pinned and present at their commit, its pages current, its board on the built site)
          node scripts/architecture-article.mjs --check
          node scripts/web-tests.mjs run checks.7
      # The merge's size record, for size-gate (plan-growth-budget-r5 §1.1,
      # §1.5): measured from the build above; it builds nothing
      - name: the size record
        run: |
          mkdir -p "$RUNNER_TEMP/size-record"
          node scripts/size-measure.mjs --record --out "$RUNNER_TEMP/size-record/sizes.json"
      # The npm package's packed and unpacked bytes, beside the record and never
      # part of the gate (plan-npm-pack-metrics-r3): report-only, so a failure
      # here is a reason in the summary, not a failed job
      - name: the npm package metrics
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/npm-pack-metrics.mjs --record --out "$RUNNER_TEMP/size-record/npm-pack.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sizes-${{ github.sha }}
          path: ${{ runner.temp }}/size-record/
          retention-days: 90
          if-no-files-found: error
      - name: Mermaid flowcharts against Mermaid's parser
        run: |
          mermaid_src="$(mktemp -d "${RUNNER_TEMP}/sagebrush-mermaid-src.XXXXXX")"
          mermaid_npm="$(mktemp -d "${RUNNER_TEMP}/sagebrush-mermaid-npm.XXXXXX")"
          trap 'rm -rf "$mermaid_src" "$mermaid_npm"' EXIT
          git clone -q --depth 1 --branch mermaid@12.1.0 --filter=blob:none --sparse https://github.com/mermaid-js/mermaid.git "$mermaid_src"
          git -C "$mermaid_src" sparse-checkout set e2e packages/mermaid/src/docs/syntax
          (cd "$mermaid_npm" && npm init -y >/dev/null && npm i --no-audit --no-fund mermaid@12.1.0 >/dev/null)
          MIN_SAME=0.97 CHROME=google-chrome node web/board/test-mermaid.mjs "$mermaid_npm" "$mermaid_src/e2e" "$mermaid_src/packages/mermaid/src/docs/syntax/flowchart.md"

  # The tested base's size record (plan-growth-budget-r5 §1.1, §1.5): the
  # base's own push record when one is usable, else the base rebuilt once, in
  # its own worktree, with the same pinned toolchain; and, for an epoch reset
  # that moves the measurement key, the base under its own key as well.
  size-base:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && (needs.changes.outputs.node == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.size_inputs == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (the worst sequential path, resolve 2 + install 5 + build 8 + the npm
    # metrics 2 + the old-key base 10 = 27, plus 15 for checkout, setup,
    # records, cleanup and upload: scripts/test-size-measure.mjs checks this sum)
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      # (a dispatch: origin/master as this job saw it, for the gate job's check of the same base)
      master: ${{ steps.resolve.outputs.master }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: "a dispatch needs origin/master (plan-size-gate-dispatch-range r2)"
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse --verify refs/remotes/origin/master || { echo "refs/remotes/origin/master is missing: the size gate can't find the base"; exit 1; }
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      # (the same pins as the checks job: budgets.json's bun, heap-budget.json's node)
      # (no pnpm cache here: this job installs only the base's worktree, and only when it needs a new
      # record, so on a cache miss with nothing installed setup-node's post-step failed the job on a
      # missing store path, #210 run 40543703855)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - id: resolve
        name: the tested base, and its record
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/size-measure.mjs --resolve-base --out-dir "$RUNNER_TEMP/size-records"
      - name: the base's worktree
        if: steps.resolve.outputs.need_new == 'true'
        run: git worktree add --detach "$RUNNER_TEMP/size-base" "${{ steps.resolve.outputs.base }}"
      - name: install (the base)
        if: steps.resolve.outputs.need_new == 'true'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/size-base
        run: pnpm install --frozen-lockfile
      - name: build (the base)
        if: steps.resolve.outputs.need_new == 'true'
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/size-base
        run: pnpm run build && node scripts/build-cli.mjs && bun web/build.ts && node scripts/build-cli.mjs
      - name: record (the base)
        if: steps.resolve.outputs.need_new == 'true'
        run: |
          node scripts/size-measure.mjs --record --root "$RUNNER_TEMP/size-base" --out "$RUNNER_TEMP/size-records/base-record.json"
          if [ "${{ steps.resolve.outputs.bootstrap }}" = true ]; then
            node scripts/size-measure.mjs --legacy --root "$RUNNER_TEMP/size-base" --out "$RUNNER_TEMP/size-records/legacy.json"
          fi
      # (the base's npm package metrics, report-only: here, before any old-key
      # toolchain, so under this run's pinned Node and its bundled npm, as the
      # merge's are; the rebuilt base when there is one, else the companion of
      # the fetched push record, bound to it; plan-npm-pack-metrics-r3 §2)
      - name: the base's npm package metrics
        if: always() && steps.resolve.outputs.mode != 'absolute'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ "${{ steps.resolve.outputs.need_new }}" = true ]; then
            node scripts/npm-pack-metrics.mjs --base --records "$RUNNER_TEMP/size-records" --root "$RUNNER_TEMP/size-base"
          else
            node scripts/npm-pack-metrics.mjs --base --records "$RUNNER_TEMP/size-records"
          fi
      # (the old-key base, O: the base's own measurement and pins)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.resolve.outputs.need_old == 'true'
        with:
          bun-version: ${{ steps.resolve.outputs.old_bun }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.resolve.outputs.need_old == 'true'
        with:
          node-version: ${{ steps.resolve.outputs.old_node }}
      - name: the base under its own key
        if: steps.resolve.outputs.need_old == 'true'
        timeout-minutes: 10
        run: |
          git worktree add --detach "$RUNNER_TEMP/size-old" "${{ steps.resolve.outputs.base }}"
          cd "$RUNNER_TEMP/size-old"
          timeout 4m pnpm install --frozen-lockfile
          timeout 5m sh -c 'pnpm run build && node scripts/build-cli.mjs && bun web/build.ts && node scripts/build-cli.mjs'
          node scripts/size-measure.mjs --record --out "$RUNNER_TEMP/size-records/old-record.json"
      - name: remove the worktrees
        if: always()
        run: |
          for w in size-base size-old; do
            [ -d "$RUNNER_TEMP/$w" ] && git worktree remove --force "$RUNNER_TEMP/$w" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size-base-${{ github.sha }}
          path: ${{ runner.temp }}/size-records/*.json
          retention-days: 7
          if-no-files-found: ignore

  # The growth gate (plan-growth-budget-r5 §1.3, §1.4): the single check that
  # decides core growth.  It fails closed: a skipped, cancelled or failed
  # record job fails it, except for a change the classifier certifies as
  # touching no measured input and no gate input.
  size-gate:
    needs: [changes, checks, size-base]
    if: always() && (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.checks.result == 'success' && needs.size-base.result == 'success'
        with:
          name: sizes-${{ github.sha }}
          path: ${{ runner.temp }}/size-merge
      # (an absolute run, schedule, dispatch or a first push, has no base, so no base records)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.checks.result == 'success' && needs.size-base.result == 'success' && needs.size-base.outputs.mode != 'absolute'
        with:
          name: size-base-${{ github.sha }}
          path: ${{ runner.temp }}/size-records
      - name: the gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          BASE: ${{ needs.size-base.result }}
          SIZE_GATE_NODE: ${{ needs.changes.outputs.node }}
          SIZE_GATE_WEB: ${{ needs.changes.outputs.web }}
          SIZE_INPUTS: ${{ needs.changes.outputs.size_inputs }}
          SIZE_DISPATCH_MASTER: ${{ needs.size-base.outputs.master }}
        run: |
          mkdir -p "$RUNNER_TEMP/size-records"
          if [ "$CHANGES" = success ] && [ "$CHECKS" = skipped ] && [ "$BASE" = skipped ] && [ "$SIZE_GATE_NODE" != true ] && [ "$SIZE_GATE_WEB" != true ] && [ "$SIZE_INPUTS" != true ]; then
            node scripts/size-measure.mjs --gate --docs-only --out "$RUNNER_TEMP/size-records/size-gate.json"
          elif [ "$CHECKS" != success ] || [ "$BASE" != success ]; then
            echo "size-gate fails closed: changes $CHANGES, checks $CHECKS, size-base $BASE"
            exit 1
          else
            cp "$RUNNER_TEMP/size-merge/sizes.json" "$RUNNER_TEMP/size-records/merge-record.json"
            node scripts/size-measure.mjs --gate --records "$RUNNER_TEMP/size-records" --out "$RUNNER_TEMP/size-records/size-gate.json"
          fi
      # (report-only: it reads the two npm-pack records and appends a table to
      # the summary; the gate's result stays the gate step's own)
      - name: the npm package metrics
        if: always()
        continue-on-error: true
        env:
          MODE: ${{ needs.size-base.outputs.mode }}
        run: node scripts/npm-pack-metrics.mjs --report --merge "$RUNNER_TEMP/size-merge/npm-pack.json" --base "$RUNNER_TEMP/size-records/base-npm-pack.json" --mode "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: size-gate-${{ github.sha }}
          path: ${{ runner.temp }}/size-records/size-gate.json
          retention-days: 90
          if-no-files-found: ignore

  web-sync:
    needs: [changes, wasm-modules]
    # (the full tier only: master pushes, the nightly schedule, a dispatch, and a pull request with the full-ci label or
    # a sync, sharing, security or data-loss path, scripts/ci-paths.mjs fullTierPaths)
    # (five parallel shards, grader's CI-time plan, Nov 9: one after another its suites took 25 min on #891, past
    # "PR CI <= 10 min"; each shard about 5 min, the share dialog 8.5. Each shard builds the site itself; the suites
    # are separate processes with their own Miniflare and Chromium, so no shard depends on another's state)
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web == 'true' && needs.changes.outputs.full == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [core, client, moves, pwa, share-dialog, share-dialog-2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # (the share-dialog shard on a pull request that doesn't change sharing: nothing to build or run, ci-paths web_share)
      - if: (matrix.shard != 'share-dialog' && matrix.shard != 'share-dialog-2') || needs.changes.outputs.web_share == 'true'
        run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - if: (matrix.shard != 'share-dialog' && matrix.shard != 'share-dialog-2') || needs.changes.outputs.web_share == 'true'
        name: the site and the test workers
        run: |
          (cd web/site && npm ci --silent)
          (cd web/test-workers && npm ci --silent)
      - name: sharing and sync (web-sync.1, about 3 min)
        if: matrix.shard == 'core'
        run: |
          node scripts/web-tests.mjs run web-sync.1
          python3 -I web/sync-protocol/gen-doc-vectors.py | diff - web/sync-protocol/doc-vectors.json
      - name: the sync client against the reference server (web-sync.5, about 4 min)
        if: matrix.shard == 'client'
        run: node scripts/web-tests.mjs run web-sync.5
      # (the view, and D11's large moves in chunks: their 100,000-entry moves take minutes)
      - name: sync's view and D11's large moves (web-sync.6, about 5 min)
        if: matrix.shard == 'moves'
        run: node scripts/web-tests.mjs run web-sync.6
      # (offline: the kept page's headers, its framing among them, security audit G-1; about 30 s)
      # (G-10: the runner's fetch broker on the share client, the page that mounts files: G1s, G4, G10)
      - name: engines, PWA and the share pages (web-sync.2, about 3 min)
        if: matrix.shard == 'pwa'
        run: node scripts/web-tests.mjs run web-sync.2
      # (DEV's try-it flow on the real notebook page: two browsers, notebooks, files, offline; the reference server.
      # Report-only from Oct 30 (#330's G-ST-1) until Nov 9; gating since (@sagebrush): #704's open-once-named broke its
      # File, New step, #939 fixed the test, and every run since passed it (6 master pushes, 2 pull requests, 56 checks
      # each).  Its result and diagnostics still go to the job summary)
      - name: DEV try-it flow
        if: matrix.shard == 'pwa'
        timeout-minutes: 10
        run: |
          c=0
          CHROME=google-chrome bun web/workspace/test-dev-sync-tryit.mjs > tryit.log 2>&1 || c=$?
          cat tryit.log
          {
            echo "### DEV try-it flow: exit $c"
            echo '```'
            grep -E "^(ok:|FAIL)|didn't come up" tryit.log | cut -c1-400 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $c
      # (last in its shard: test-no-site-build rebuilds web/dist without web/site/)
      - name: previews, dependencies, the share client and the builds (web-sync.4, about 40 s)
        if: matrix.shard == 'pwa'
        run: node scripts/web-tests.mjs run web-sync.4
      # (the share dialog, alone in its shard: about 8.5 min here (13 on a slow runner since #243's registry cases), 20
      # its bound. On a pull request only when it changes sharing or has the full-ci label (ci-paths web_share); master,
      # the schedule and a dispatch always run it)
      - name: share dialog, its own cases (web-sync.3, about 5 min)
        if: matrix.shard == 'share-dialog' && needs.changes.outputs.web_share == 'true'
        timeout-minutes: 20
        run: node scripts/web-tests.mjs run web-sync.3
      # (the share dialog's second half, SHARE_DIALOG_PART=2: the 100,000-file listing and the upload-leak cases, about 7 min)
      - name: share dialog, the big listing and the upload leaks (web-sync.7)
        if: matrix.shard == 'share-dialog-2' && needs.changes.outputs.web_share == 'true'
        timeout-minutes: 20
        run: node scripts/web-tests.mjs run web-sync.7

  # "Export all current files (.zip)" (E1): its browser test.  The scale test's CI pass, the controls (each rule
  # undone in a copy of the chunk, its named check failing) and the campaign check run nightly (nightly.yml).
  web-export:
    needs: [changes, wasm-modules]
    # (selected by its area's paths: scripts/ci-paths.mjs webAreas)
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web_export == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (test-export alone: about 4.5 min on #459's runs)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: the export
        shell: bash
        run: |
          set -eo pipefail
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          node scripts/web-tests.mjs run web-export

