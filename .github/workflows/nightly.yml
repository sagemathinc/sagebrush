# The slow audits that prove the tests themselves, run nightly instead of on every pull request (CI speed plan,
# option 1; William, Nov 2 2026): the export's controls (each rule undone in a copy of the chunk, its named check
# failing), the export's scale test and the campaign gate's check, and the lookalike report's controls.  The tests
# they audit (test-export.mjs, test-workspace-lookalike.mjs) still run on every pull request in ci.yml.  A change
# that quietly weakens a test is caught here, up to a day later.
name: nightly

env:
  SAGEBRUSH_CPUS_OVERRIDE: ${{ vars.CI_CPUS }}
  # (as ci.yml: a stalled cache download gives up as a miss after 2 minutes instead of 10)
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * *"

concurrency:
  group: nightly-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  export-controls:
    if: github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (57 controls at about 30 s each, plus the scale harness: about 33 min in ci.yml's web-export, E1 #436)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four WebAssembly modules wasm/pins.json names, published: design/wasm-artifacts.md section 6)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: "false"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: the export at scale, its controls and the campaign check
        shell: bash
        run: |
          set -eo pipefail
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          node scripts/web-tests.mjs run export-controls

  lookalike-controls:
    if: github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (each control rebuilds the site: about 21 min for all of them on a local 8-CPU run)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four WebAssembly modules wasm/pins.json names, published: design/wasm-artifacts.md section 6)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: "false"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: the lookalike report's controls
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          node scripts/web-tests.mjs run lookalike-controls
