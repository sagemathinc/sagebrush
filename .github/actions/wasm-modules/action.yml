name: wasm modules
description: >-
  Puts the four WebAssembly modules in wasm/ before anything reads them (design/wasm-artifacts.md sections 4 and 6).
  When this run built them (its wasm-modules job), installs that artifact after checking it and the pin policy;
  otherwise fetches the published modules that wasm/pins.json names (a no-op while they are committed and match).
inputs:
  artifact:
    description: "'true' when this run's wasm-modules job built the modules"
    required: true
  allow-fresh:
    description: "'true' only for a pull request's engine test jobs: run a build that doesn't match the pins, labelled"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.artifact == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: wasm-modules-${{ github.sha }}
        path: ${{ runner.temp }}/wasm-modules
    - if: inputs.artifact == 'true'
      shell: bash
      env:
        ALLOW_FRESH: ${{ inputs.allow-fresh }}
      run: node scripts/wasm-artifact.mjs install "$RUNNER_TEMP/wasm-modules" $([ "$ALLOW_FRESH" = true ] && echo --allow-fresh)
    - if: inputs.artifact != 'true'
      shell: bash
      run: node scripts/wasm-fetch.mjs
