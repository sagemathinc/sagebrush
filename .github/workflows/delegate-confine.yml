# The Delegate runner's confinement evidence (notebook run --confine under Deno), on each platform the runner supports:
# the built bundle under the runner's own Deno flags, with the escape rows required, never skipped
# (SAGEBRUSH_REQUIRE_DENO=1). It runs by hand only (workflow_dispatch), never as a required check, and needs no
# secrets.
name: delegate-confine

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the commit to test (a full sha)"
        required: true

permissions:
  contents: read

jobs:
  confine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # (the input must be a full 40-hex commit sha, never a branch or tag that can move)
      - name: the input is a full commit sha
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-hex commit sha, got: $REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: the checkout is exactly that sha
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "HEAD $(git rev-parse HEAD) is not $REF"; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # (the four modules from their published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # (the runner's pinned Deno, the version the confinement was measured under)
          deno-version: "2.9.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build && node scripts/build-cli.mjs
      - name: the confinement rows, Deno rows required
        env:
          SAGEBRUSH_REQUIRE_DENO: "1"
        # (bash with pipefail, so a failing row fails the step through the tee)
        shell: bash
        run: |
          deno --version
          node --version
          uname -a
          git rev-parse HEAD
          node --test --test-timeout=300000 --test-reporter=spec dist/test/notebook-run.test.js | tee notebook-run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: delegate-confine-${{ matrix.os }}
          path: notebook-run.log
          retention-days: 7
