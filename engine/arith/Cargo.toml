[package]
name = "sagebrush-arith"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Exact arithmetic for the Sagebrush engines: word-size moduli, number-theoretic transforms, polynomials over Z/n, Z and Q, and dense matrices over Z/p, Z and Q (multimodular, certified)"

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-par = { path = "../par" }
num-integer = "0.1"
num-traits = "0.2"
dashu-int = "0.6"


[dev-dependencies]
# (tests only: check counts and Stop at a chosen check, tests/dense_mul_stop.rs)
sagebrush-interrupt = { path = "../interrupt", features = ["test-hooks"] }

[lints]
workspace = true
