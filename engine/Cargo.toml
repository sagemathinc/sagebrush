[workspace]
resolver = "2"
members = ["interrupt", "bigint", "ball", "arith", "mpoly", "group", "galois", "sym", "modsym", "hmf", "ap", "poly", "classgroup", "flint", "oracle", "cli", "py", "wasm", "node", "web", "raster"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Tests run optimized (the exact tests do real work) but keep overflow checks.
[profile.test]
opt-level = 3
