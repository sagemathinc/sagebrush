[package]
name = "sagebrush-kernels-relaxed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "sagebrush's exp and log kernels built with relaxed SIMD (hardware fused multiply-add)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["relaxed"]
relaxed = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace]
