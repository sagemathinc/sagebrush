      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: runner, workspace and board frame
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          # (G-10: the runner's fetch broker on the notebook page, each case's server its own)
          # (`sagebrush notebook DIR` reads, writes and lists only what is really inside DIR: no symbolic link out)
