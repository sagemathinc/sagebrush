  # The interrupt matrix's CI set (plan-interrupt-harness r5 section 8): Ctrl-C on the CLI, the
  # interactive prompt and the notebook page's Stop, with the signal trials S1-S4 and the
  # PENDING-READY probes, against web/interrupt-baseline.json.  Its own job.  The harness has an
  # absolute 15-min deadline (about 2x pilot 4's 401 s + 33 s): every session, guard and CDP wait is
  # clipped to it, its last 30 s are for cleanup and the report, and a watchdog at the deadline writes
  # the report and exits.  The job's 30 min covers checkout, install and builds (up to about 14 min)
  # on top, so the job timeout never cuts the harness's report.
  interrupt-matrix:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && (needs.changes.outputs.web == 'true' || needs.changes.outputs.engine_smoke == 'true')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: interrupt matrix (CI set)
        timeout-minutes: 16
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          mkdir -p interrupt-out
          node scripts/web-tests.mjs run interrupt-matrix
      - name: keep the rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interrupt-matrix
          path: interrupt-out/
          if-no-files-found: ignore

  # Kedlaya's Frobenius matrix in Playwright's WebKit worker (plan-kedlaya-
  # webkit-ci r4): detection (JavaScriptCore on a browser host), the exact
  # production refusal (its JSC table is established for Bun only), and Stop
  # at four stages under a test-only override.  No heap snapshots and no
  # browser cache: certification of the table on WebKit is unavailable (r4),
  # and this job certifies nothing about memory.  Selected by its own paths
  # on pull requests (scripts/ci-paths.mjs webkitPaths), and always by the
  # nightly schedule and a dispatch; the workflow's concurrency group is per
  # pull request, so a new revision cancels only its own obsolete run.
  webkit:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.webkit == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (from the runs: build 14-26 s, install 28-64 s, test 32-58 s; one
    # install stalled on the apt mirror past the old 15-minute job limit,
    # so the install and the test each have their own, and a stall names
    # its step)
    timeout-minutes: 18
    env:
      PLAYWRIGHT_VERSION: "1.57.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      # (WebKit's apt dependencies, about 180 packages and 117 MB, dominate the install, and the Azure apt
      # mirror has stalled their download past this step's 10 minutes: #189's dispatch, twice, Oct 26.
      # On GitHub's hosted runners (ephemeral VMs: the apt.conf.d line below dies with the job) their .debs
      # are cached per runner image and Playwright version; a CI_RUNNER installs as before, uncached.
      # apt takes an archive already in its cache on its size alone, so every restored .deb is first
      # checked against the SHA256 in the signed Packages index and against apt's canonical name for it,
      # and one that fails is deleted and downloaded again (scripts/ci-verify-debs.sh, astra #191 r1, r2).  A run that adds a .deb the cache
      # lacked, even one cut short by the timeout, saves the whole set under a new key, so a slow mirror's
      # progress carries over; a run that adds none saves nothing.  Entries aren't capped here: about one
      # per run that adds a .deb (a new image or Playwright version, a superseded package), each the full
      # set (about 120 MB), until GitHub's cache eviction (least recently used, 10 GB per repository, and
      # after 7 days unused).)
      - name: apt from Ubuntu's own archive, not Azure's mirror
        if: ${{ vars.CI_RUNNER == '' }}
        run: scripts/ci-apt-mirror.sh
      - name: WebKit's apt packages, the cache key
        id: debs-key
        if: ${{ vars.CI_RUNNER == '' }}
        run: echo "prefix=webkit-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}-pw$PLAYWRIGHT_VERSION-" >> "$GITHUB_OUTPUT"
      - name: WebKit's apt packages, restored
        if: ${{ steps.debs-key.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sb-webkit-debs
          key: ${{ steps.debs-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.debs-key.outputs.prefix }}
      - name: WebKit's apt packages, verified against the signed index
        if: ${{ steps.debs-key.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          scripts/ci-verify-debs.sh --self-test
          mkdir -p ~/sb-webkit-debs
          restored=$(cd ~/sb-webkit-debs && ls | grep -c '\.deb$' || true)
          sudo apt-get -o Acquire::Retries=5 update -qq
          out=$(scripts/ci-verify-debs.sh ~/sb-webkit-debs)
          echo "$restored .debs restored; $out"
          if [ "$restored" -gt 0 ] && echo "$out" | grep -q '^kept 0,'; then echo "::warning::no restored .deb matched the apt index: the cache is doing nothing"; fi
          (cd ~/sb-webkit-debs && ls | grep '\.deb$' || true) > "$RUNNER_TEMP/debs-restored"
          mkdir -p ~/sb-webkit-debs/partial  # (after the check, which leaves only verified .debs)
          printf 'Dir::Cache::Archives "%s/";\nAcquire::Retries "5";\n' ~/sb-webkit-debs | sudo tee /etc/apt/apt.conf.d/99sb-webkit-debs > /dev/null
      - name: "Playwright's WebKit, pinned"
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && echo '{"private": true}' > package.json
          npm i --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION" && npx playwright install --with-deps webkit
      - name: WebKit's apt packages, saved if this run downloaded one the cache lacked
        id: debs-new
        if: ${{ !cancelled() && steps.debs-key.outcome == 'success' }}
        run: |
          # (superseded versions dropped first, so a saved set holds only what apt can still use)
          sudo apt-get -o Dir::Cache::Archives="$HOME/sb-webkit-debs/" autoclean > /dev/null || true
          sudo rm -rf ~/sb-webkit-debs/partial ~/sb-webkit-debs/lock
          sudo chown -R "$(id -u):$(id -g)" ~/sb-webkit-debs
          (cd ~/sb-webkit-debs && ls | grep '\.deb$' || true) > "$RUNNER_TEMP/debs-now"
          touch "$RUNNER_TEMP/debs-restored"
          added=$(comm -13 <(sort "$RUNNER_TEMP/debs-restored") <(sort "$RUNNER_TEMP/debs-now") | wc -l)
          echo "$(wc -l < "$RUNNER_TEMP/debs-now") .debs now, $added new"
          if [ "$added" -gt 0 ]; then echo save=true >> "$GITHUB_OUTPUT"; fi
      - name: WebKit's apt packages, saved
        if: ${{ !cancelled() && steps.debs-new.outputs.save == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sb-webkit-debs
          key: ${{ steps.debs-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: detection, the production refusal and Stop in WebKit's worker
        timeout-minutes: 5
        run: BROWSER=webkit PLAYWRIGHT="$RUNNER_TEMP/pw" node web/test-kedlaya-worker.mjs
      - name: the terminal's long-line pages copy as one line in WebKit (board's B-LL-4)
        timeout-minutes: 3
        run: BROWSER=webkit PLAYWRIGHT="$RUNNER_TEMP/pw" node web/shell/test-panel-pages-copy.mjs
      - name: "Playwright's Firefox, pinned"
        timeout-minutes: 10
        run: cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps firefox
      - name: code runs in the sandboxed runner in Firefox (a shared notebook and the notebook page)
        timeout-minutes: 5
        run: |
          (cd web/site && npm ci --silent)
          BROWSER=firefox PLAYWRIGHT="$RUNNER_TEMP/pw" node web/share/test-runner-engines.mjs

  web-browser:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.web_groups != '[]') }}
    strategy:
      fail-fast: false
      matrix:
        # (the groups a change selects, scripts/ci-paths.mjs webGroups: all of notebook, preload, latex, board-a, board-b, board-c,
        # board-unit, terminal and remote-preview on the full tier, a core web, runtime or workflow change)
        group: ${{ fromJSON(needs.changes.outputs.web_groups) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    # (the terminal group: its own flagged build and a long page test (about 11 min in the project): 25; remote
    # compute's preview page test, about 8 min in the project (483 s at 8ccc970a): its own group, 25)
    timeout-minutes: ${{ (matrix.group == 'terminal' || matrix.group == 'remote-preview') && 25 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.group == 'board-unit'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # (the latex group: the LaTeX editor's build with its page also on loopback hosts, which its page tests open;
      # every other group the site's build)
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
        env:
          SAGEBRUSH_LATEX_PREVIEW: ${{ matrix.group == 'latex' && 'test' || '' }}
      - name: browser group ${{ matrix.group }}
        env:
          CHROME: google-chrome
          GROUP: ${{ matrix.group }}
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          case "$GROUP" in
            notebook)
              # (the bash shell's loader and its worker's own policy: plan-bash-shell r3 step 1)
              # (ShellHost, the mediator, over a real workspace: step 2)
              node scripts/web-tests.mjs run web-browser/notebook
              ;;
            preload)
              # (background loading on the notebook page, web/preload.ts: its own group, about 2 min, so notebook's
              # stays inside PR CI's 10 min; selected exactly as notebook is, scripts/ci-paths.mjs webGroups)
              node scripts/web-tests.mjs run web-browser/preload
              ;;
            terminal)
              # (the terminal panel, plan-bash-shell r8c step 6: a group of its own, since its page test needs a flagged
              # build and its own time: its renderer and caps, its size (E5.6), then the page with the bash set in dist,
              # as a hosted preview has it)
              # (Tab completion, help, compgen and ls colours, the pure functions: plan-term-help-tab)
              node scripts/web-tests.mjs run web-browser/terminal.1
              bun web/shell/panel-size.mjs
              node scripts/web-tests.mjs run web-browser/terminal.2
              SAGEBRUSH_TERMINAL=1 bun web/build.ts
              node scripts/web-tests.mjs run web-browser/terminal.3
              # (the Terminal in the desktop and Android apps: app/dist served as the app serves it, isolated and not;
              # the app self-test's Terminal checks, their probe and verdicts without an app)
              node app/build-frontend.mjs
              node scripts/web-tests.mjs run web-browser/terminal.4
              ;;
            board-a)
              node web/board/bench.mjs
              node scripts/web-tests.mjs run web-browser/board-a
              ;;
            board-b)
              node scripts/web-tests.mjs run web-browser/board-b
              ;;
            board-c)
              # (the board page under the board journal; its own server, one origin)
              node scripts/web-tests.mjs run web-browser/board-c
              ;;
            remote-preview)
              # (remote compute's preview, end to end in the page: the picker, the Connect sheet, a Run through the
              # simulated gateway, Stop with Runs queued (14(c)), Restart, another tab; it serves web/dist itself)
              node scripts/web-tests.mjs run web-browser/remote-preview
              ;;
            latex)
              # (the LaTeX editor's page and its agent tools, end to end against the build above: William's top
              # priority made binding; the grader's finding on #566)
              node scripts/web-tests.mjs run web-browser/latex
              ;;
            board-unit)
              (cd packages/sagebrush-board && bun build.mjs && node test.mjs)
              node scripts/web-tests.mjs run web-browser/board-unit.1
              bun web/board/gen-merge3-board-vectors.mjs --check
              node scripts/web-tests.mjs run web-browser/board-unit.2
              ;;
          esac

