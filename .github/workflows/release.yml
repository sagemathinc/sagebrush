# Release on a version tag (v0.1.1, ...): check the tag matches the package
# versions, publish `sagebrush` and `sagebrush-web` to npm with trusted
# publishing (OIDC; no token), and attach self-contained executables for
# every platform (deno compile cross-compiles from Linux) to the GitHub
# release.  R2 upload and macOS/Windows signing come later.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # GitHub release assets
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: npm with trusted publishing (needs npm >= 11.5)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --test dist/test/ target/
      - name: versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/sagebrush cdn; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      - name: build the bundle and executables
        run: |
          node scripts/build-cli.mjs
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            node scripts/build-cli.mjs --deno --target=$t
          done
          mkdir -p release
          for f in build/cli/pyjs-deno-*; do
            name="sagebrush-${f#build/cli/pyjs-deno-}"
            case "$name" in *windows*.exe) ;; *windows*) name="$name.exe" ;; esac
            cp "$f" "release/$name"
          done
          (cd release && for f in *; do xz -T0 -6 "$f"; done && sha256sum * > SHA256SUMS)
          ls -la release
      - name: publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd packages/sagebrush && npm publish --provenance --access public)
          (cd cdn && npm publish --provenance --access public)
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
