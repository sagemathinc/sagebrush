[package]
name = "sagebrush-modsym"
version = "0.1.0"
edition = "2021"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
num-bigint = "0.4"
num-traits = "0.2"
sagebrush-poly = { path = "../poly" }

[dev-dependencies]
sagebrush-ap = { path = "../ap" }
# LGPL; used only by the orbit tests and examples, never by the library.
sagebrush-flint = { path = "../flint" }
serde_json = "1"
