<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared collection — Sagebrush</title>
<meta name="robots" content="noindex">
<!-- the link preview: generic as written; for a live share the site's Worker sets the title and the
     canonical URLs in these same elements (web/site/src/preview.ts, share-ux-plan r2 §6.3) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sagebrush">
<meta property="og:title" content="A shared notebook on Sagebrush">
<meta property="og:description" content="A notebook shared on Sagebrush. Open it to run it in your browser.">
<meta property="og:url" content="/s/">
<meta property="og:image" content="/s/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sagebrush: a shared notebook. Open it to run it in your browser.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="A shared notebook on Sagebrush">
<meta name="twitter:description" content="A notebook shared on Sagebrush. Open it to run it in your browser.">
<meta name="twitter:image" content="/s/og.png">
<meta name="twitter:image:alt" content="Sagebrush: a shared notebook. Open it to run it in your browser.">
<style>
  :root { color-scheme: light dark; --fg: #1f2421; --bg: #fbfaf7; --muted: #6b716d; --line: #e2e0d8; --accent: #4a6b49; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8e4; --bg: #161917; --muted: #9aa19b; --line: #2e332f; --accent: #8fb98d; } }
  body { margin: 0 auto; max-width: 980px; padding: 16px 20px 60px; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: baseline; gap: 12px; }
  header a.home { color: var(--accent); text-decoration: none; font-weight: 600; }
  h1 { font-size: 1.6em; margin: 14px 0 4px; overflow-wrap: anywhere; }
  #meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #meta a { color: var(--accent); }
  ul#files { list-style: none; padding: 0; margin: 14px 0; border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow: auto; }
  #files li { display: flex; gap: 10px; align-items: baseline; padding: 4px 10px; border-top: 1px solid var(--line); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #files li:first-child { border-top: 0; }
  #files li > :first-child { flex: 1; overflow-wrap: anywhere; }
  #files .size { color: var(--muted); }
  #files a.dl { color: var(--accent); font: 12px system-ui, sans-serif; }
  button.link { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; }
  button.link.on { font-weight: 700; text-decoration: none; }
  #nbbar { display: flex; gap: 8px; align-items: center; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 3; border-bottom: 1px solid var(--line); }
  #nbbar b { flex: 1; overflow-wrap: anywhere; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #nbbar button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  #nbbar button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #status { color: var(--muted); font-size: 13px; margin: 6px 0; }
</style>
<script src="/alpha-banner.js" defer></script>
</head>
<body>
<header><a class="home" href="/">🌿 Sagebrush</a></header>
<h1 id="title">Loading…</h1>
<div id="meta"></div>
<ul id="files" aria-label="Files"></ul>
<div id="nbbar" hidden>
  <b id="nbname"></b>
  <button class="primary" id="runall" title="Run every cell in your browser">▶ Run all</button>
  <button id="stop" title="Interrupt">■ Stop</button>
  <button id="download" title="This notebook as .ipynb, with your changes">Download .ipynb</button>
</div>
<p id="status"></p>
<div id="nb"></div>
<script type="module" src="/sagebrush-share.js"></script>
</body>
</html>
