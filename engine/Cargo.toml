[workspace]
resolver = "2"
members = ["interrupt", "ledger", "par", "bigint", "ball", "arith", "mpoly", "group", "galois", "sym", "modsym", "hmf", "ap", "poly", "classgroup", "flint", "oracle", "cli", "py", "wasm", "node", "web", "raster", "growth-probe"]

# Unsafe code is the trusted boundary of the engine ledger's safe-Rust proof
# (no-cliffs C-2c-ii scope r4 section 1.3): denied everywhere; each existing
# site carries #[allow(unsafe_code)] on its smallest enclosing item, pinned by
# test/unsafe-allow-inventory.json (scripts/unsafe-inventory.mjs).
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Tests run optimized (the exact tests do real work) but keep overflow checks.
[profile.test]
opt-level = 3
