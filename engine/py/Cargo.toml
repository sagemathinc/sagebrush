[package]
name = "sagebrush-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "sagebrush_native"
crate-type = ["cdylib"]

[dependencies]
sagebrush-sym = { path = "../sym" }
sagebrush-bigint = { path = "../bigint" }
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-ledger = { path = "../ledger" }
sagebrush-modsym = { path = "../modsym" }
sagebrush-ap = { path = "../ap" }
sagebrush-web = { path = "../web" }
sagebrush-mpoly = { path = "../mpoly" }
sagebrush-raster = { path = "../raster" }
sagebrush-par = { path = "../par", features = ["parallel"] }
pyo3 = { version = "0.27", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4"
serde_json = "1"

[features]
# Tests only, never in a released wheel: _native._test_guarded (test_capacity.py)
# and the interrupt hooks' _test_trace / _test_traced / _test_arm_at /
# _test_stopped / _test_now_ns (test_interrupt_matmul.py's phase-targeted Stops)
test-hooks = ["sagebrush-interrupt/test-hooks"]
