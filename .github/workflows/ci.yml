# Build pyjs and run its test suites on Node, Deno and Bun.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      # The conformance oracle is CPython 3.14 itself.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --test 'dist/test/*.test.js' 'target/*.test.js'
      - name: single-file bundle
        run: node scripts/build-cli.mjs
      - name: conformance (Node)
        run: python3 conformance/run.py --runtime node --show 20
      - name: conformance (Deno)
        run: python3 conformance/run.py --runtime deno --show 20
      - name: conformance (Bun)
        run: python3 conformance/run.py --runtime bun --show 20
      - name: Sage mode (modular forms, elliptic curves), checked against Sage's output
        run: python3 sage-tests/run.py -v
      - name: symbolic calculus (limits, solve, taylor) in the WebAssembly engine
        run: python3 sage-tests/run_calculus.py
      - name: the Python package's copies of lib/ (and the 3D viewer's) are up to date
        run: scripts/sync-python-package.sh --check && node scripts/gen-viewer3d.mjs --check
      - name: Magma mode (modular forms, elliptic curves), checked against Magma's output
        run: python3 magma-tests/run.py -v
      - name: numpy, checked against NumPy itself
        # NumPy's AVX-512 kernels for exp/log/sin... differ from glibc's libm in
        # the last bit; sagebrush (like NumPy without AVX-512) follows glibc.
        env:
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          python3 -m pip install numpy==2.5.1
          python3 numpy-tests/run.py -v
      - name: mpmath test suite under CPython and pyjs
        run: |
          python3 -m pip install mpmath==1.3.0
          python3 bench/mpmath/compare.py -j 4
