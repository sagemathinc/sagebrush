[package]
name = "sagebrush-interrupt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cooperative interruption (Ctrl-C) for the Sagebrush engines"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# WebAssembly: poll the host's flag through the import `sagebrush.interrupted`
# (engine/web, whose hosts provide it)
wasm-host = []
# Tests only: count checks per phase and request Stop at a chosen check
# (sagebrush_interrupt::hooks)
test-hooks = []
# Native hosts that must not install a SIGINT handler (the desktop app's N-API add-on, #825 N1):
# a process-global word, armed per call with the run's token, that the host's control thread stops
# by compare-and-swap (sagebrush_interrupt::host_arm/host_stop/host_disarm)
host-word = []

[lints]
workspace = true
