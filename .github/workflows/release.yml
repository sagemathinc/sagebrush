# Release on a version tag (v0.1.1, ...): check the tag matches the package
# versions, publish `sagebrush` and `sagebrush-web` to npm with trusted
# publishing (OIDC; no token), then `@sagemathinc/sagebrush-board` when its
# own version is new, and attach self-contained executables for
# every platform (deno compile cross-compiles from Linux) to the GitHub
# release.  R2 upload and macOS/Windows signing come later.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read # verify the tagged commit's full CI before publishing
  contents: write # GitHub release assets
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # The Jupyter release smoke test uses Python 3.14, as in CI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: npm with trusted publishing (needs npm >= 11.5)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: require green full CI for the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "master")] | length')
          [ "$ok" -gt 0 ] || { echo "No successful full ci.yml run on master for $GITHUB_SHA"; exit 1; }
      - run: pnpm run build
      - name: versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/sagebrush cdn; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
          # (the board package has versions of its own; it names the CLI it
          # pairs with, `sagebrush board answers`: ^MAJOR.MINOR.0 of the tag)
          pin=$(node -p "require('./packages/sagebrush-board/package.json').peerDependencies.sagebrush")
          want="^$(echo "$tag" | cut -d. -f1-2).0"
          [ "$pin" = "$want" ] || { echo "packages/sagebrush-board pairs with sagebrush $pin, tag is $tag (want $want)"; exit 1; }
      - name: build the bundle and executables
        run: |
          # the bundle, the notebook page (which needs the bundle), then the
          # bundle again with the page in it; its notebook serves every asset
          node scripts/build-cli.mjs
          bun web/build.ts
          node scripts/build-cli.mjs
          node web/test-cli-assets.mjs build/cli/pyjs.cjs
          # the Jupyter kernel, end to end with Jupyter's own client
          python3 -m venv /tmp/jv && /tmp/jv/bin/pip install -q jupyter_client
          /tmp/jv/bin/python test/jupyter_kernel.py build/cli/pyjs.cjs
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            node scripts/build-cli.mjs --deno --target=$t
          done
          # every executable prints its licenses and notices
          build/cli/pyjs-deno-x86_64-unknown-linux-gnu --licenses | grep -q "Third-party notices for the npm package"
          mkdir -p release
          for f in build/cli/pyjs-deno-*; do
            name="sagebrush-${f#build/cli/pyjs-deno-}"
            case "$name" in *windows*.exe) ;; *windows*) name="$name.exe" ;; esac
            cp "$f" "release/$name"
          done
          # Windows users get a .zip (with the licenses and notices); everything
          # else .xz, the same files beside them (and `sagebrush --licenses`)
          NOTICES="LICENSE-MIT LICENSE-APACHE cdn/LICENSE-CPython.txt LICENSE-Artistic-2.0.txt packages/sagebrush/THIRD-PARTY-NOTICES.txt"
          (cd release && for f in *; do
             case "$f" in
               *.exe) (cd .. && zip -q -j "release/${f%.exe}.zip" "release/$f" $NOTICES) && rm "$f"
                      unzip -l "${f%.exe}.zip" | grep -q THIRD-PARTY-NOTICES.txt ;;
               *) xz -T0 -6 "$f" ;;
             esac
           done && for n in $NOTICES; do cp "../$n" .; done && sha256sum * > SHA256SUMS)
          ls -la release
      # Upload to R2 (served at https://get.sagebrush.space): a tag goes to
      # releases/<tag>/ and becomes "latest"; a manual run goes to dev/<sha>/
      # (exercises the credentials without publishing anything).
      - name: upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          s3() { aws s3 "$@" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then dest="releases/$GITHUB_REF_NAME"; else dest="dev/$GITHUB_SHA"; fi
          # (a rerun of a tag never replaces binaries already published for it)
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && curl -fsS -o /dev/null "https://get.sagebrush.space/$dest/SHA256SUMS"; then
            echo "$dest is already uploaded; keeping it, and the GitHub release gets those same files"
            rm -rf release && mkdir release
            curl -fsS -o release/SHA256SUMS "https://get.sagebrush.space/$dest/SHA256SUMS"
            for f in $(awk '{print $2}' release/SHA256SUMS); do curl -fsS -o "release/$f" "https://get.sagebrush.space/$dest/$f"; done
            (cd release && sha256sum -c --quiet SHA256SUMS)
          else
            s3 cp release/ "s3://sagebrush-releases/$dest/" --recursive
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            printf '%s\n' "$GITHUB_REF_NAME" > latest
            s3 cp latest s3://sagebrush-releases/latest --content-type text/plain --cache-control "max-age=60"
            s3 cp scripts/install.sh s3://sagebrush-releases/install.sh --content-type text/plain --cache-control "max-age=300"
          fi
          echo "uploaded to https://get.sagebrush.space/$dest/"
          curl -fsSI "https://get.sagebrush.space/$dest/SHA256SUMS" | head -1
      - name: publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # sagebrush-web: the committed engine and a fresh pyparse, smoke-tested
          node cdn/build.mjs
          node cdn/smoke.mjs
          # (a rerun publishes only versions npm doesn't have yet. A version npm
          # is still holding, in its automated review or staged for approval,
          # can't be published over: npm answers E409 "previously staged
          # version"; that counts as published, with a warning)
          pub() {
            local out
            if out=$(npm publish --provenance --access public 2>&1); then echo "$out"; return 0; fi
            echo "$out"
            if grep -q "Cannot publish over previously staged version" <<<"$out"; then
              echo "::warning title=npm held::$1 is held by npm (review or staging), not yet visible"
              return 0
            fi
            return 1
          }
          for d in packages/sagebrush cdn; do
            n=$(node -p "require('./$d/package.json').name"); v=$(node -p "require('./$d/package.json').version")
            if npm view "$n@$v" version >/dev/null 2>&1; then echo "$n $v is published already"; else (cd $d && pub "$n@$v"); fi
          done
          # the board package, after sagebrush (it pairs with that CLI); its
          # version is its own, so a tag that doesn't change it publishes nothing
          cd packages/sagebrush-board
          bv=$(node -p "require('./package.json').version")
          if npm view "@sagemathinc/sagebrush-board@$bv" version >/dev/null 2>&1; then
            echo "@sagemathinc/sagebrush-board $bv is published already"
          else
            bun build.mjs
            pub "@sagemathinc/sagebrush-board@$bv"
          fi
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release $GITHUB_REF_NAME exists"; else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
