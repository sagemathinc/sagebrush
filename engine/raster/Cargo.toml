[package]
name = "sagebrush-raster"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sagebrush's PNG module: its own plots' SVG drawn with tiny-skia, and PNG files read with limits; a wasm32 module of its own, loaded when a PNG is first written or read"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
png = "0.18"
crc32fast = "1"

# The WebAssembly heap: dlmalloc over our own system layer, which bounds the
# pages the heap may grow by (src/wasm.rs; PNG plan r8 §2.2)
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "=0.2.14", default-features = false }
