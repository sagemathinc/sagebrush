name: pypi-mcp

# The thin `sagebrush-mcp` package (engine/py-mcp: an entry point over
# sagebrush.mcp_server).  A manual run builds and tests; an `mcp-v*` tag also
# publishes to PyPI by trusted publishing (publisher: this repository,
# workflow `pypi-mcp.yml`, environment `pypi`).

on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: build and test
        run: |
          python -m pip install build
          python -m build engine/py-mcp --outdir dist
          python -m pip install dist/*.whl
          python engine/py/test_mcp.py
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
