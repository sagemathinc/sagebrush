      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.group == 'board-unit'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs && bun web/build.ts
      - name: browser group ${{ matrix.group }}
        env:
          CHROME: google-chrome
          GROUP: ${{ matrix.group }}
        run: |
          python3 web/serve.py 8765 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sleep 1
          kill -0 "$server_pid"
          case "$GROUP" in
            notebook)
              node web/test-replay.mjs
              node web/test-timetravel.mjs
              node web/test-widgets.mjs
              node web/test-input.mjs
              node web/test-graph-view.mjs
              node web/test-kernels.mjs
              node web/test-time.mjs
              node web/test-reactive.mjs
              node web/test-warm.mjs
              node web/test-notebook-blocks.mjs
              node web/test-doclang.mjs
              node web/test-big-pictures.mjs
              node web/test-png.mjs
              node web/test-pkgset.mjs
              node web/test-phone-layout.mjs
              node web/notebook/test-anchor.mjs
              node web/test-kernel-start.mjs
              node web/test-pkgset-pin.mjs
              node web/test-pkgset-page.mjs
              # (the bash shell's loader and its worker's own policy: plan-bash-shell r3 step 1)
              bun web/test-shell.mjs
              # (ShellHost, the mediator, over a real workspace: step 2)
              bun web/shell/test-shell-host.mjs
              bun web/shell/test-bounded-json.mjs
              node web/test-worker-limits.mjs
              node web/test-kedlaya-worker.mjs
              ;;
            terminal)
              # (the terminal panel, plan-bash-shell r8c step 6: a group of its own, since its page test needs a flagged
              # build and its own time: its renderer and caps, its size (E5.6), then the page with the bash set in dist,
              # as a hosted preview has it)
              bun web/shell/test-panel-render.mjs
              bun web/shell/panel-size.mjs
              node web/shell/test-panel-pages-copy.mjs
              SAGEBRUSH_TERMINAL=1 bun web/build.ts
              bun web/shell/test-panel-page.mjs
              # (the Terminal in the desktop and Android apps: app/dist served as the app serves it, isolated and not;
              # the app self-test's Terminal checks, their probe and verdicts without an app)
              node app/build-frontend.mjs
              bun web/shell/test-panel-app.mjs
              bun web/notebook/test-terminal-probe.mjs
              ;;
            board-a)
              node web/board/bench.mjs
              node web/test-board.mjs
              NO_EDIT=1 node web/test-board.mjs examples/primes.json
              NO_EDIT=1 node web/test-board.mjs examples/mermaid.md
              NO_EDIT=1 node web/test-board.mjs examples/source.json
              NO_EDIT=1 node web/test-board.mjs examples/integers.json
              node web/board/test-export.mjs
              node web/board/test-offline.mjs
              node web/board/test-ink-board.mjs
              node web/board/test-ink-draw.mjs
              node web/board/test-backdrop.mjs
              node web/board/test-present.mjs
              node web/board/test-tour.mjs
              ;;
            board-b)
              node web/board/test-templates.mjs
              node web/board/test-stickers.mjs
              node web/board/test-cached.mjs
              node web/board/test-code.mjs
              node web/board/test-modes.mjs
              node web/board/test-engine-start.mjs
              node web/board/test-outputs.mjs
              node web/board/test-images.mjs
              node web/board/test-mobile.mjs
              node web/board/test-inplace.mjs
              node web/board/test-addsame.mjs
              node web/board/test-ask.mjs
              ;;
            board-c)
              board_c_test() { printf 'START board-c: %s\n' "$*"; "$@"; }
              board_c_test node web/board/test-find-cdp-unit.mjs
              board_c_test node web/board/test-find.mjs
              board_c_test node web/board/test-titles.mjs
              board_c_test node web/board/test-fit.mjs
              board_c_test node web/board/test-local.mjs
              board_c_test node web/board/test-links.mjs
              board_c_test node web/board/test-version.mjs
              board_c_test node web/board/test-blocks.mjs
              board_c_test node web/board/test-history.mjs
              board_c_test node web/board/test-history-order.mjs
              # (the board page under the board journal; its own server, one origin)
              board_c_test bun web/board/test-board-journal-page.mjs
              board_c_test node web/board/test-cocalc.mjs
              board_c_test node web/board/test-mount.mjs
              board_c_test node web/board/test-xss.mjs
              ;;
            board-unit)
              (cd packages/sagebrush-board && bun build.mjs && node test.mjs)
              bun web/board/test-format.mjs
              bun web/notebook/test-kernel-evaluate.mjs
              bun web/notebook/test-kernel-warm.mjs
              bun web/notebook/test-runner-fallback.mjs
              bun web/notebook/test-remote-kernel.mjs
              bun web/board/test-canvas.mjs
              bun web/board/test-palette.mjs
              bun web/board/test-channel.mjs
              bun web/board/test-merge.mjs
              bun web/board/test-cached-store.mjs
              bun web/board/test-complete.mjs
              bun web/board/test-syncdb.mjs
              bun web/board/test-board-merge3.mjs
              bun web/board/gen-merge3-board-vectors.mjs --check
              bun web/board/test-lossless.mjs
              bun web/board/test-mermaid-export.mjs
              bun web/board/test-fromhtml.mjs
              bun web/board/test-svg.mjs
              bun web/board/test-layout-speed.mjs
              bun web/board/test-graph.mjs
              bun web/graph/test-spring.mjs
              bun web/board/test-route.mjs
              bun web/board/test-history-speed.mjs
              bun web/board/test-preview.mjs
              bun web/board/test-outcache.mjs
              bun web/test-image-size.mjs
