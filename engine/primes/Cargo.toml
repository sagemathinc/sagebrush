[package]
name = "sagebrush-primes"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prime-number functions: the logarithmic integral li(x) and Li(x), sieves, and pi(x)"

[dependencies]
sagebrush-interrupt = { path = "../interrupt" }

[dev-dependencies]
# (the Stop tests name the phase a Stop lands in)
sagebrush-interrupt = { path = "../interrupt", features = ["test-hooks"] }

[lints]
workspace = true
