[package]
name = "sagebrush-ap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Traces of Frobenius a_p of elliptic curves over Q, for all primes up to a bound"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-ball = { path = "../ball" }
sagebrush-interrupt = { path = "../interrupt" }
rayon = { version = "1.10", optional = true }
