            sage) python3 sage-tests/run.py -v ;;
            magma-matlab)
              python3 magma-tests/run.py -v
              python3 matlab-tests/run.py -v
              ;;
            numeric)
              python3 numpy-tests/run.py -v
              python3 scipy-tests/run.py -v
              python3 bench/mpmath/compare.py -j "$SAGEBRUSH_CPUS"
              ;;
            aux)
              python3 pypi-tests/run.py
              python3 sage-tests/run_calculus.py
              ;;
          esac

  # mpmath's own suite on each backend: the core (the default) and the rollback, SAGEBRUSH_MPMATH_BACKEND=python, so
  # the rollback never rots (design/mpmath-core.md 6.1, point 2); two shards each, by measured seconds
  # (bench/mpmath/suite.py). The core's shard 1 also runs the fuzzer's fixed-seed subset against CPython's python
  # backend (point 3: 10^4 cases, about a minute)
  mpmath-suite:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.modes == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        backend: [sagebrush, python]
        shard: [1, 2]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install mpmath==1.3.0
      - run: pnpm install --frozen-lockfile && pnpm run build
      - name: mpmath's suite, backend ${{ matrix.backend }}, shard ${{ matrix.shard }}/2
        run: python3 bench/mpmath/suite.py --backend ${{ matrix.backend }} --shard ${{ matrix.shard }}/2 -j "$SAGEBRUSH_CPUS"
      - name: the fuzzer's fixed-seed subset, the core against CPython
        if: matrix.backend == 'sagebrush' && matrix.shard == 1
        working-directory: bench/mpmath
        run: |
          MPMATH_NOGMPY=1 python3 fuzz.py gen --seed 1 --n 10000 > "$RUNNER_TEMP/ref.txt"
          SAGEBRUSH_MPMATH_BACKEND=sagebrush node ../../dist/src/cli.js fuzz.py gen --seed 1 --n 10000 > "$RUNNER_TEMP/got.txt"
          python3 fuzz.py diff "$RUNNER_TEMP/ref.txt" "$RUNNER_TEMP/got.txt"

  engine-rust:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_smoke == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - working-directory: engine
        run: cargo test --workspace --exclude sagebrush-flint --exclude sagebrush-oracle

  # (numerics-core P2a, r4.2 §12: no microkernel ships that no CI host has executed. engine/nd's NEON kernel
  # runs only on aarch64; this job executes its oracle, thread-determinism and bit-family tests on Apple
  # silicon. engine/nd/src/micro.rs NEON_ENABLED may be turned on only once this job is green on master.)
  engine-nd-neon:
    needs: changes
    if: github.repository == 'sagemathinc/sagebrush' && needs.changes.outputs.engine_smoke == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: nd-neon
      - name: "engine/nd on aarch64: the NEON kernel's oracle, thread determinism and FMA-family bits"
        working-directory: engine
        run: |
          uname -m
          test "$(uname -m)" = arm64
          cargo test --release -p sagebrush-nd --features parallel -- --nocapture


  # (the unsafe boundary's compiler sweep, #234 r2 U1: every unsafe site the compiler sees, generated and
  # expanded code included, must lie in a pinned allowed item; its own cache, parallel to engine-rust)
  engine-unsafe-sweep:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.unsafe_sweep == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: "--force-warn unsafe-code"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: unsafe-sweep
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: "unsafe boundary: compiler sweep over host, feature, wasm32 and windows-msvc views (scripts/unsafe-sweep.sh)"
        run: |
          scripts/unsafe-sweep.sh "$RUNNER_TEMP/sweep"
          if grep -q ' rc=[1-9]' "$RUNNER_TEMP/sweep/timings.txt"; then tail -20 "$RUNNER_TEMP"/sweep/*.err; exit 1; fi
          node scripts/unsafe-inventory.mjs --check --compiler "$RUNNER_TEMP"/sweep/host-default.json "$RUNNER_TEMP"/sweep/host-features.json "$RUNNER_TEMP"/sweep/wasm.json "$RUNNER_TEMP"/sweep/windows.json --metadata "$RUNNER_TEMP/sweep/metadata.json"

  # The four WebAssembly modules, built once for the jobs that read wasm/ (design/wasm-artifacts.md section 4): on a
  # pull request that changes what they're built from or how they're handled (scripts/ci-paths.mjs, wasm_build), and
  # on every other event.  Uploaded with their manifest (this run, this commit) as wasm-modules-<sha>; the readers
  # check it and the pin policy (scripts/wasm-artifact.mjs) before installing.
  wasm-modules:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.wasm_build == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: build the four modules, and the pins they need
        run: |
          node scripts/build-engine.mjs
          node scripts/check-engine-module.mjs wasm/sagebrush-engine.wasm
          # (a mismatch with wasm/pins.json: labelled on a pull request, whose engine test jobs run it; every other
          # reader of a pull request fails at install, and any other event fails here)
          node scripts/wasm-artifact.mjs policy --allow-fresh
          node scripts/wasm-artifact.mjs pack "$RUNNER_TEMP/wasm-modules"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-modules-${{ github.sha }}
          path: ${{ runner.temp }}/wasm-modules
          if-no-files-found: error
          retention-days: 3

  # Publishes this run's modules to the release bucket (design/wasm-artifacts.md section 5): only for a push to master
  # and a dispatch on master, in the wasm-publish environment (deployment branches: master; the bucket credentials).
  # Never cancelled.  Each absent key is written with a conditional write and read back; a present key must match.
  # Then a cold client checks every pin of this commit is served.
  wasm-publish:
    needs: [changes, wasm-modules]
    if: github.repository == 'sagemathinc/sagebrush' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.wasm-modules.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: wasm-publish
    concurrency:
      group: wasm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-modules-${{ github.sha }}
          path: ${{ runner.temp }}/wasm-modules
      - name: publish the four modules, each read back
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/wasm-publish.mjs "$RUNNER_TEMP/wasm-modules"
      - name: every pin of this commit is served (a cold client)
        run: node scripts/wasm-pins.mjs --verify-published

  engine-wasm:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_smoke == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the producer's four modules, checked, when it ran: built once per run; labelled fresh on a pull request whose
      # pins are stale, so this job still smoke-tests the change)
      - if: needs.wasm-modules.result == 'success'
        uses: ./.github/actions/wasm-modules
        with:
          artifact: "true"
          allow-fresh: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile
      - name: build and smoke-test a fresh WebAssembly engine
        env:
          PRODUCED: ${{ needs.wasm-modules.result == 'success' }}
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          # (the four modules: this run's wasm-modules build when it ran, installed by the step above; else built here)
          [ "$PRODUCED" = true ] || node scripts/build-engine.mjs
          # (no-cliffs C r16 section 3.2: no start section, every active segment within the initial memory and table)
          node scripts/check-engine-module.mjs wasm/sagebrush-engine.wasm
          # (no-cliffs C r15 section 1: the growth envelope against the engine's own allocator, a never-shipped probe module)
          (cd engine && cargo build --release -p sagebrush-growth-probe --target wasm32-unknown-unknown)
          node engine/growth-probe/sweep.mjs engine/target/wasm32-unknown-unknown/release/sagebrush_growth_probe.wasm
          node engine/web/tests/wasm_designated.mjs
          # (a stale committed engine: an ERROR on master pushes, dispatches and the schedule, a warning on a PR)
          node scripts/check-fresh-wasm.mjs
          node scripts/third-party-notices.mjs --check
          pnpm run build
          node scripts/build-cli.mjs
          node --test --test-concurrency="$SAGEBRUSH_CPUS" dist/test/groups.test.js dist/test/kernels.test.js dist/test/mpfield-matrix.test.js dist/test/special.test.js dist/test/sage.test.js dist/test/scipy-integrate.test.js
          python3 sage-tests/run_calculus.py

  engine-node:
    needs: [changes, engine-wasm, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.engine-wasm.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
          allow-fresh: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # (test/kedlaya.test.ts checks the JavaScript engine detection under Deno too)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Node tests on the fresh engine, shard ${{ matrix.shard }}/8
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          mapfile -d '' files < <(find dist/test -maxdepth 1 -type f -name '*.test.js' ! -name 'magma.test.js' ! -name 'matlab.test.js' ! -name 'sprig*.test.js' -print0 | sort -z)
          node --test --test-concurrency="$SAGEBRUSH_CPUS" --test-shard=${{ matrix.shard }}/8 "${files[@]}"

  engine-language:
    needs: [changes, engine-wasm, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.engine-wasm.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
          allow-fresh: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Magma and MATLAB Node tests on the fresh engine, case shard ${{ matrix.shard }}/6
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          node scripts/test-name-shard.mjs test/magma.test.ts dist/test/magma.test.js ${{ matrix.shard }}/6
          node scripts/test-name-shard.mjs test/matlab.test.ts dist/test/matlab.test.js ${{ matrix.shard }}/6

  engine-modes:
    needs: [changes, engine-wasm, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.engine-wasm.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_full == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
          allow-fresh: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install scipy==1.18.1 numpy==2.5.1
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: Sage, calculus, Magma and MATLAB on the fresh engine
        env:
          SAGEBRUSH_TIME_SCALE: "3"
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          python3 sage-tests/run.py -v
          python3 sage-tests/run_calculus.py
          python3 magma-tests/run.py -v
          python3 matlab-tests/run.py -v

  engine-cpython:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_cpython == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python3 -m pip install maturin
      # (bun runs the page's own modules in test_pairing.py's remote tests: the page tunnel's end-to-end case in
      # test_remote_pair.py and test_remote_terminal_page.py; without it, both print SKIPPED and test nothing)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: CPython extension, audit regressions, MCP and Sage
        run: |
          (cd engine/py && maturin build --release --out dist)
          python3 -m pip install engine/py/dist/*.whl
          python3 engine/py/test_audit.py
          python3 engine/py/test_certify.py
          python3 engine/py/test_bench.py
          python3 engine/py/test_mcp.py
          python3 engine/py/test_runs.py
          python3 engine/py/test_runs_sweep.py
          python3 engine/py/test_workspace_tools.py
          python3 engine/py/test_latex_comments.py
          python3 engine/py/test_pairing.py
          python3 engine/py/test_chat.py
          python3 engine/py/test_limits.py
          python3 engine/py/test_engine_errors.py
          python3 engine/py/test_memguard.py
          python3 engine/py/test_capacity.py
          python3 engine/py/test_session_ctrl.py
          python3 engine/py/test_ctrlc_cleanup.py
          python3 engine/py/test_python_floor.py --wheel
          python3 engine/py/test_progress.py
          python3 engine/py/test_kedlaya.py
          python3 engine/py/test_ffmat_echelon.py
          python3 sage-tests/run_cpython.py -v

  # clippy on sagebrush-py (FU-CI-CLIPPY, plan r4e): no workflow ran clippy, so a deny-level lint in Ctrl-C PR B's test
  # code reached a green PR ci unseen. Default and all features (test-hooks, the crate's only feature), every target,
  # on the toolchain engine/rust-toolchain.toml pins;
  # correctness and suspicious denied, the warn-level lints reported, not gated. The VM baseline at 1ff3d5cd: 0
  # errors, CLEAN in both passes. The summarizer (scripts/clippy) counts from clippy's JSON and is checked against its
  # fixtures first.
  engine-clippy:
    needs: changes
    if: (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.engine_cpython == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      # (engine/rust-toolchain.toml pins the toolchain (1.99.1, profile minimal) for every cargo command under engine/:
      #  clippy goes onto THAT toolchain, which rustup selects here from the file; the file itself is unchanged.
      #  `rustup toolchain install` with no name installs the file's toolchain first, explicitly, rather than
      #  relying on rustup's implicit install on first use, whose default has changed between rustup releases.
      #  RUSTUP_AUTO_INSTALL=0 turns that implicit install off for this step, so a command that would need it fails
      #  instead; `rustup --version` comes after the install, since it resolves the active toolchain too)
      - name: clippy for the pinned engine toolchain
        working-directory: engine
        env:
          RUSTUP_AUTO_INSTALL: "0"
        run: rustup toolchain install && rustup --version && rustup component add clippy && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: the clippy summarizer against its fixtures
        run: bash scripts/clippy/run-fixtures.sh scripts/clippy
      - name: "clippy, sagebrush-py, default and all features: correctness and suspicious denied; warnings reported, not gated"
        working-directory: engine
        run: |
          # (pyo3's build script needs an interpreter: setup-python's, from its pythonLocation; ci-local (event
          #  "local") has no setup-python step and uses the host's python3)
          if [ -n "${pythonLocation:-}" ]; then PYO3_PYTHON=$pythonLocation/bin/python
          elif [ "${GITHUB_EVENT_NAME:-}" = local ]; then PYO3_PYTHON=$(command -v python3)
          else echo "setup-python's pythonLocation is unset"; exit 1; fi
          export PYO3_PYTHON
          # (each identity producer keeps its own status: under bash -eo pipefail a failed one fails the step)
          v_rustc=$(rustc -V); v_cargo=$(cargo -V); v_clippy=$(cargo clippy -V); v_py=$("$PYO3_PYTHON" -V 2>&1); v_lock=$(sha256sum < Cargo.lock)
          echo "$v_rustc | $v_cargo | $v_clippy | PYO3_PYTHON $PYO3_PYTHON ($v_py) | Cargo.lock ${v_lock%% *}"
          bad=0
          for pass in default all; do
            flags=(); [ "$pass" = all ] && flags=(--all-features)
            rc=0
            cargo clippy -p sagebrush-py --no-deps --all-targets "${flags[@]}" --locked --message-format=json -- -D clippy::correctness -D clippy::suspicious > "$RUNNER_TEMP/clippy-$pass.json" || rc=$?
            echo "== $pass features: cargo rc $rc"
            python3 -I ../scripts/clippy/clippy-summary.py "$RUNNER_TEMP/clippy-$pass.json" "$rc" engine/py/Cargo.toml || bad=1
            [ "$rc" = 0 ] || bad=1
          done
          exit $bad

  # The examples gallery (plan U7, section 2): each selected example run from source and compared with what
  # is committed (scripts/examples.mjs), at most 16 a shard, each killed at 30 s; examples-census then
  # requires every selected example to have run exactly once
  examples:
    needs: [changes, wasm-modules]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.wasm-modules.result) && ((github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.examples_matrix != '[]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.examples_matrix) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detect CI CPU quota
        run: scripts/ci-cpus.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      # (the same pins as the checks job: build-cli.mjs bundles with bun)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      # (the four modules: this run's wasm-modules artifact when it built them, else the published pins)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: ${{ needs.wasm-modules.result == 'success' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile && pnpm run build && node scripts/build-cli.mjs
      - name: shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          EXAMPLES_IDS: ${{ needs.changes.outputs.examples_ids }}
        run: node scripts/examples.mjs ci --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --ran "$RUNNER_TEMP/examples-ran/ran-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: examples-ran-${{ matrix.shard }}
          path: ${{ runner.temp }}/examples-ran/
          if-no-files-found: ignore

  examples-census:
    needs: [changes, examples]
    if: always() && (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '') && needs.changes.outputs.examples_matrix != '[]'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: examples-ran-*
          merge-multiple: true
          path: ${{ runner.temp }}/examples-ran
      - name: every selected example ran exactly once
        env:
          EXAMPLES_IDS: ${{ needs.changes.outputs.examples_ids }}
        run: mkdir -p "$RUNNER_TEMP/examples-ran" && node scripts/examples.mjs census --ran-dir "$RUNNER_TEMP/examples-ran"

  ci:
    if: always() && (github.repository == 'sagemathinc/sagebrush' || vars.CI_RUNNER != '')
    needs:
      - changes
      - census
      - node-tests
      - language-node
      - sprig
      - checks
      - size-gate
      - web-sync
      - web-runner
      - web-export
      - web-runner-sync
      - web-artifacts
      - web-lookalike
      - web-sync-ops
      - web-browser
      - interrupt-matrix
      - conformance
      - modes
      - mpmath-suite
      - engine-rust
      - wasm-modules
      - wasm-publish
      - engine-wasm
      - engine-node
      - engine-language
      - engine-modes
      - engine-cpython
      - engine-clippy
      - engine-unsafe-sweep
      - webkit
      - examples
      - examples-census
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: require every selected job to pass
        env:
          RESULTS: >-
            ${{ needs.changes.result }} ${{ needs.census.result }}
            ${{ needs.node-tests.result }}
            ${{ needs.language-node.result }}
            ${{ needs.sprig.result }}
            ${{ needs.checks.result }} ${{ needs.size-gate.result }}
            ${{ needs.web-sync.result }}
            ${{ needs.web-runner.result }} ${{ needs.web-export.result }} ${{ needs.web-runner-sync.result }} ${{ needs.web-artifacts.result }}
            ${{ needs.web-lookalike.result }} ${{ needs.web-sync-ops.result }}
            ${{ needs.web-browser.result }}
            ${{ needs.interrupt-matrix.result }}
            ${{ needs.conformance.result }} ${{ needs.modes.result }} ${{ needs.mpmath-suite.result }}
            ${{ needs.engine-rust.result }} ${{ needs.wasm-modules.result }} ${{ needs.wasm-publish.result }} ${{ needs.engine-wasm.result }}
            ${{ needs.engine-node.result }} ${{ needs.engine-language.result }}
            ${{ needs.engine-modes.result }}
            ${{ needs.engine-cpython.result }}
            ${{ needs.engine-clippy.result }} ${{ needs.engine-unsafe-sweep.result }}
            ${{ needs.examples.result }} ${{ needs.examples-census.result }}
            ${{ needs.webkit.result }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
