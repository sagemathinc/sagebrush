[package]
name = "sagebrush-modsym"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["parallel"]
parallel = ["sagebrush-par/parallel"]

[dependencies]
sagebrush-bigint = { path = "../bigint" }
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-par = { path = "../par" }
num-traits = "0.2"
sagebrush-poly = { path = "../poly" }

[dev-dependencies]
# (the examples run their own rayon pools)
rayon = "1.10"
sagebrush-ap = { path = "../ap" }
serde_json = "1"
