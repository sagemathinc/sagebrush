# The desktop app (app/, Tauri 2): its web page is built once, then the app
# for macOS (Apple silicon), Linux and Windows.  Each app runs its self-test
# (app/selftest) in that platform's web view, and the installers are kept as
# artifacts (unsigned).  mac-release, for an app-v* tag or a dispatch with
# `sign`, builds the Mac app signed and notarized (the sagebrush-signing
# environment's credentials) and checks it as a person's Mac will.
name: app

on:
  push:
    branches: [master]
    # (a signed and notarized Mac app: mac-release below)
    tags: ["app-v*"]
    paths: ["app/**", "web/**", "src/**", "lib/**", "wasm/pins.json", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "web/**", "src/**", "lib/**", "wasm/pins.json", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Build the signed and notarized Mac app (the sagebrush-signing environment)"
        type: boolean
        default: false

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  page:
    if: github.repository == 'sagemathinc/sagebrush'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # (the four WebAssembly modules wasm/pins.json names, published: design/wasm-artifacts.md section 6)
      - uses: ./.github/actions/wasm-modules
        with:
          artifact: "false"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/build-cli.mjs
      - run: bun web/build.ts
      - run: node app/build-frontend.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-page
          path: app/dist

  app:
    if: github.repository == 'sagemathinc/sagebrush'
    needs: page
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            exe: app/src-tauri/target/release/sagebrush-app
          - os: ubuntu-22.04
            exe: app/src-tauri/target/release/sagebrush-app
          - os: windows-latest
            exe: app/src-tauri/target/release/sagebrush-app.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-page
          path: app/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      # (`apt-get update` has hung silently: on Nov 1 and twice on Nov 10 it
      # printed nothing after "Get:5 ... jammy-security InRelease" until the
      # job's 40-minute timeout. On a passing run it takes 8-26 s (30 passes,
      # Nov 10), so it gets 90 s a try, 3 tries. The install is left as it
      # was: a slow mirror makes it take up to about 21 min on a passing run,
      # still moving, so it has no bound of its own; the job's 40 minutes remain.
      # timeout runs under sudo so that it signals apt-get itself: run outside
      # sudo, it killed only sudo, and the apt-get left behind kept the lists
      # lock, so the next tries failed at once)
      - name: Linux libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          scripts/ci-apt-mirror.sh
          for try in 1 2 3; do
            if sudo timeout -k 10 90 apt-get -o Acquire::Retries=3 update; then break; fi
            if [ "$try" = 3 ]; then echo "::error::apt-get update failed or stalled 3 times"; exit 1; fi
            echo "::warning::apt-get update try $try failed or stalled; trying again"
            sleep 5
          done
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      # (the exact CLI: its bundler, tauri-bundler 2.10.4, names the AppImage
      # tools below; the iOS and Android workflows pin the same 2.12.4)
      - run: npm install -g @tauri-apps/cli@2.12.4
      # The AppImage tools, pinned: the bundler downloads them from GitHub
      # unverified unless they are already in its tools directory
      # (tauri-bundler 2.10.4 src/bundle/linux/appimage/linuxdeploy.rs: the
      # cache dir's tauri/, each file skipped if it exists, AppRun-x86_64,
      # linuxdeploy-07333c6-x86_64.AppImage, linuxdeploy-plugin-appimage.AppImage).
      # So they are put there first, each checked by its SHA-256: a mismatch or
      # a failed download is a red, never skipped.  The plugin is the tagged
      # 1-alpha-20250213-1, not the bundler's moving "continuous" URL.
      - name: the AppImage tools, pinned by SHA-256
        if: runner.os == 'Linux'
        run: |
          T="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$T"
          cd "$T"
          curl -fsSL -o AppRun-x86_64 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          curl -fsSL -o linuxdeploy-07333c6-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          # (printed before the check: the packet's cross-check of the pins)
          sha256sum AppRun-x86_64 linuxdeploy-07333c6-x86_64.AppImage linuxdeploy-plugin-appimage.AppImage
          printf '%s\n' \
            'f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64' \
            '36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62  linuxdeploy-07333c6-x86_64.AppImage' \
            '992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3  linuxdeploy-plugin-appimage.AppImage' \
            > /tmp/appimage-tools.sha256
          sha256sum -c --strict /tmp/appimage-tools.sha256
          chmod 0755 AppRun-x86_64 linuxdeploy-07333c6-x86_64.AppImage linuxdeploy-plugin-appimage.AppImage
          # The bundler patches linuxdeploy in place on every build: its
          # prepare_tools ends with `dd if=/dev/zero bs=1 count=3 seek=8
          # conv=notrunc of=<linuxdeploy>` ("This should prevent linuxdeploy to
          # be detected by appimage integration tools"), zeroing the AppImage
          # magic "AI\x02".  So after the build linuxdeploy must be exactly the
          # pinned bytes with that patch, and the other two exactly the pins.
          [ "$(od -An -tx1 -j8 -N3 linuxdeploy-07333c6-x86_64.AppImage | tr -d ' \n')" = 414902 ] || { echo "FAIL: linuxdeploy's bytes 8-10 are not the AppImage magic AI\\x02"; exit 1; }
          cp linuxdeploy-07333c6-x86_64.AppImage /tmp/linuxdeploy-patched
          dd if=/dev/zero of=/tmp/linuxdeploy-patched bs=1 count=3 seek=8 conv=notrunc 2> /dev/null
          grep -v ' linuxdeploy-07333c6-x86_64.AppImage$' /tmp/appimage-tools.sha256 > /tmp/appimage-tools-after.sha256
          echo "$(sha256sum < /tmp/linuxdeploy-patched | cut -d' ' -f1)  linuxdeploy-07333c6-x86_64.AppImage" >> /tmp/appimage-tools-after.sha256
          rm /tmp/linuxdeploy-patched
          cat /tmp/appimage-tools-after.sha256
          # (exactly three well-formed lines: an empty hash from a failed
          # sha256sum above must not leave a list that checks fewer files)
          [ "$(grep -c -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' /tmp/appimage-tools-after.sha256)" = 3 ] && [ "$(wc -l < /tmp/appimage-tools-after.sha256)" = 3 ] || { echo "FAIL: the expected-after list is not three well-formed lines"; exit 1; }
      - name: build
        if: runner.os != 'Linux'
        working-directory: app/src-tauri
        run: tauri build --ci
      # (Linux: its output kept, for the check below)
      - name: build (Linux)
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        # (an explicit bash is -eo pipefail: the build's status, not tee's)
        shell: bash
        run: tauri build --ci 2>&1 | tee /tmp/tauri-build.log
      # (the bundler must have used the pinned tools: it downloaded nothing,
      # and they are still the pinned bytes, linuxdeploy with only its patch)
      - name: the AppImage tools were the pinned ones
        if: runner.os == 'Linux'
        run: |
          if grep -n 'Downloading http' /tmp/tauri-build.log; then echo "FAIL: the bundler downloaded a tool (above), so a pin's file name no longer matches"; exit 1; fi
          grep -q 'Bundling .*\.AppImage' /tmp/tauri-build.log || { echo "FAIL: no AppImage bundled"; exit 1; }
          cd "${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          sha256sum -c --strict /tmp/appimage-tools-after.sha256
      - name: self-test (Linux, in a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node app/selftest/run.mjs ${{ matrix.exe }}
      # GTK's TIFF loader brings libtiff and libjbig (GPL-2+): removed, and
      # the stripped AppImage itself self-tested (DIST-F1)
      - name: strip the TIFF loader from the AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s\n' 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL=/tmp/appimagetool sh app/strip-appimage.sh app/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: self-test the stripped AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: xvfb-run -a node app/selftest/run.mjs $(ls app/src-tauri/target/release/bundle/appimage/*.AppImage)
      - name: self-test
        if: runner.os != 'Linux'
        run: node app/selftest/run.mjs ${{ matrix.exe }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sagebrush-app-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  mac-release:
    # (only on this repository, and only for a push of a tag app-v* or a dispatch that asks to sign: never on a pull
    # request, so no pull request's code ever runs with the signing environment's secrets, and a dispatch without
    # `sign` never signs, even on an app-v* tag; scripts/test-app-release-guard.mjs pins the cases)
    if: github.repository == 'sagemathinc/sagebrush' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')) || (github.event_name == 'workflow_dispatch' && inputs.sign))
    needs: page
    runs-on: macos-15
    timeout-minutes: 60
    environment: sagebrush-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-page
          path: app/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
      # (no rust-cache here: a release build starts clean, from this commit's sources only)
      - run: npm install -g @tauri-apps/cli@2.12.4
      # Where the credentials will be, fixed before anything is written, so the last step removes them whatever
      # failed, a half-made one too
      - name: The credentials' paths
        run: |
          {
            echo "SAGEBRUSH_KEYCHAIN=$RUNNER_TEMP/sagebrush-signing.keychain-db"
            echo "SAGEBRUSH_P12=$RUNNER_TEMP/sagebrush-developer-id.p12"
            echo "SAGEBRUSH_NOTARY_DIR=$RUNNER_TEMP/sagebrush-notary"
          } >> "$GITHUB_ENV"
      # The certificates into a keychain made for this job, with a random password, unlocked for its length only;
      # the notarization key into a file in the runner's temporary folder.  Every value is checked present first,
      # and none is printed.
      - name: Import the Apple credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.SAGEBRUSH_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SAGEBRUSH_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_ISSUER_ID }}
          SIGN_ID: ${{ secrets.SAGEBRUSH_MACOS_SIGN_ID }}
        run: |
          for value in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID SIGN_ID; do
            [[ -n "${!value}" ]] || { echo "Missing $value" >&2; exit 1; }
          done
          umask 077
          certificate="$SAGEBRUSH_P12"
          # (the key file under Apple's own name, AuthKey_<key id>.p8, in a folder only this job's user can read)
          mkdir -m 700 "$SAGEBRUSH_NOTARY_DIR"
          api_key="$SAGEBRUSH_NOTARY_DIR/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain="$SAGEBRUSH_KEYCHAIN"
          keychain_password="$(openssl rand -base64 32)"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_P12, "base64"), { mode: 0o600 })' \
            "$certificate"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_NOTARY_KEY, "base64"), { mode: 0o600 })' \
            "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$certificate"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          # (the identity must be in the keychain, by its exact name: a wrong SIGN_ID fails here, not at notarization)
          security find-identity -v -p codesigning "$keychain" | grep -qF "\"$SIGN_ID\"" || { echo "The signing identity is not in the imported certificates" >&2; exit 1; }
          echo "SAGEBRUSH_NOTARY_KEY=$api_key" >> "$GITHUB_ENV"
      # Tauri signs the app (hardened runtime, a secure timestamp), notarizes it with the API key and staples it
      # (tauri-bundler's macOS signing: APPLE_SIGNING_IDENTITY, APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_PATH)
      - name: Build, sign and notarize the app
        working-directory: app/src-tauri
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SAGEBRUSH_MACOS_SIGN_ID }}
          APPLE_API_KEY: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_ISSUER_ID }}
        run: APPLE_API_KEY_PATH="$SAGEBRUSH_NOTARY_KEY" tauri build --ci --bundles app,dmg
      # The disk image itself: signed, notarized and stapled too, so a downloaded .dmg opens without a warning
      # whether or not the person is online
      - name: Sign, notarize and staple the disk image
        env:
          SIGN_ID: ${{ secrets.SAGEBRUSH_MACOS_SIGN_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.SAGEBRUSH_APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "$(echo "$dmg" | wc -l)" = 1 ] || { echo "expected exactly one .dmg: $dmg" >&2; exit 1; }
          codesign --force --timestamp --sign "$SIGN_ID" "$dmg"
          xcrun notarytool submit "$dmg" --key "$SAGEBRUSH_NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          node -e 'const r = require(process.argv[1]); console.log("notarization:", r.status, r.id); if (r.status !== "Accepted") process.exit(1)' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "$dmg"
          echo "SAGEBRUSH_DMG=$dmg" >> "$GITHUB_ENV"
      # What a person's Mac will check: the app's signature (deep, strict), Gatekeeper's verdict on the app and the
      # image, the stapled tickets, and the same on a copy marked as downloaded from the web (quarantined)
      - name: Check the signature and Gatekeeper's verdict
        run: |
          app=$(ls -d app/src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime Version|Timestamp)='
          codesign -d --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' || { echo "FAIL: the app isn't signed with the hardened runtime" >&2; exit 1; }
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$SAGEBRUSH_DMG"
          xcrun stapler validate "$SAGEBRUSH_DMG"
          q="$RUNNER_TEMP/downloaded.dmg"
          cp "$SAGEBRUSH_DMG" "$q"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$q"
          mnt=$(hdiutil attach -nobrowse -readonly "$q" | awk -F'\t' '/\/Volumes\//{print $NF}')
          spctl --assess --type execute --verbose=4 "$mnt"/*.app
          hdiutil detach "$mnt"
      # the signed app runs: the app's own self-test (app/selftest), on the binary inside the signed bundle
      - name: self-test the signed app
        run: node app/selftest/run.mjs "$(ls -d app/src-tauri/target/release/bundle/macos/*.app)/Contents/MacOS/sagebrush-app"
      - name: SHA-256
        run: |
          cd "$(dirname "$SAGEBRUSH_DMG")"
          shasum -a 256 "$(basename "$SAGEBRUSH_DMG")" | tee "$(basename "$SAGEBRUSH_DMG").sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sagebrush-app-macos-signed
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
      # (the keychain, the certificate file and the key file go, whatever happened above: their paths were fixed first)
      - name: Remove the credentials
        if: always()
        run: |
          if [ -n "${SAGEBRUSH_KEYCHAIN:-}" ] && [ -e "$SAGEBRUSH_KEYCHAIN" ]; then security delete-keychain "$SAGEBRUSH_KEYCHAIN" || rm -f "$SAGEBRUSH_KEYCHAIN"; fi
          rm -f "${SAGEBRUSH_P12:-/nonexistent}"
          rm -rf "${SAGEBRUSH_NOTARY_DIR:-/nonexistent}"
