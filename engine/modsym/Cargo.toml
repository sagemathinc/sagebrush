[package]
name = "sagebrush-modsym"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["parallel"]
parallel = ["sagebrush-par/parallel"]
# (tests only, never in a release: traces::pins, the Stop-prefix pins'
# entry to the twisted traces' kernels, tests/hecke_stop.rs; turned on by
# the dev-dependency on this crate below)
test-pins = []

[dependencies]
sagebrush-arith = { path = "../arith" }
sagebrush-bigint = { path = "../bigint" }
num-integer = "0.1"
sagebrush-interrupt = { path = "../interrupt" }
sagebrush-par = { path = "../par" }
num-traits = "0.2"
sagebrush-poly = { path = "../poly" }

[dev-dependencies]
# (the examples run their own rayon pools)
rayon = "1.10"
# (tests only: the longest time between Stop checks, tests/newforms_poll_gap.rs)
sagebrush-interrupt = { path = "../interrupt", features = ["test-hooks"] }
sagebrush-ap = { path = "../ap" }
serde_json = "1"
# (tests only: this crate with test-pins, for tests/hecke_stop.rs)
sagebrush-modsym = { path = ".", features = ["test-pins"] }

[lints]
workspace = true
