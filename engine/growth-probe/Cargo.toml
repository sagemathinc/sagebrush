[package]
name = "sagebrush-growth-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tests only, never shipped: a WebAssembly module whose allocator is the engine's (std's dlmalloc on wasm32-unknown-unknown), so the growth envelope W(b) is checked against real page growth (no-cliffs C r15 section 1)"
publish = false

# (standard library only; no dependency of sagebrush-web, so the engine's
# module is built exactly as before)
[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
